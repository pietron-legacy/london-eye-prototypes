<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>London Eye — Build your perfect visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy:        #092241;
    --text-black:  #1A1A1A;
    --text-sub:    #8C8C8C;
    --border:      #CCD2D8;
    --line:        #E8E8E8;
    --blue:        #3A6FA0;
    --gray:        #CED3D9;
    --gray-overlay: rgba(188, 193, 202, 0.60);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Barlow', sans-serif; }
  html, body {
    margin: 0; padding: 0;
    background: #d8d8d8;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    color: var(--text-black);
  }
  body { display: flex; align-items: center; justify-content: center; padding: 16px 0; min-height: 100vh; }
  .device {
    width: 393px;
    height: 852px;
    background: white;
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
  }

  /* ===== iOS status bar ===== */
  .ios-status {
    height: 58px;
    padding-top: 21px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 16px;
    padding-right: 16px;
    font-family: -apple-system, 'SF Pro', Inter, sans-serif;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .ios-status .time { font-size: 17px; font-weight: 590; }
  .ios-status .icons { display: flex; gap: 7px; align-items: center; font-size: 13px; }

  /* Merlin partner banner — shared with the rest of the in-app flow. */
  .merlin-banner {
    background: #092241;
    text-align: center;
    padding: 8px 0;
    position: sticky;
    top: 58px;
    z-index: 28;
  }
  .merlin-banner img { height: 16px; display: inline-block; vertical-align: middle; }

  /* ===== Header ===== */
  .nav {
    height: 64px;
    background: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 58px;
    z-index: 29;
  }
  .nav .back, .nav .placeholder {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: transparent;
    border: 0;
    cursor: pointer;
    color: black;
  }
  .nav .back svg { width: 22px; height: 22px; }
  .nav h1 {
    flex: 1;
    text-align: center;
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: black;
  }

  /* ===== Body ===== */
  /* Scrolling viewport for the page body. Footer sits absolutely above it. */
  .body {
    padding: 16px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .body::-webkit-scrollbar { display: none; }
  .body.has-footer { padding-bottom: 300px; }

  .intro h2 {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-black);
    margin: 0 0 8px;
  }
  .intro p {
    font-size: 16px;
    font-weight: 400;
    color: var(--text-black);
    margin: 0;
    line-height: 1.4;
  }

  /* ===== Cards grid ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .card {
    position: relative;
    background: white;
    border: 1px solid var(--gray);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* Compact uniform height across LE and secondary cards. */
    height: 213px;
  }
  .card.included,
  .card.selected { border: 1px solid var(--navy); }

  /* ----- London Eye (included) — image fills the whole card, gradient text overlay at bottom ----- */
  .card-eye .img-wrap { position: relative; flex: 1; min-height: 0; }
  .card-eye .img-wrap > img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-eye .badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(255,255,255,0.92);
    color: var(--navy);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px; font-weight: 500;
    z-index: 2;
    line-height: 1.2;
  }
  .card-eye .overlay-text {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    padding: 32px 8px 8px;
    color: white;
    background: linear-gradient(0deg, #092241 60%, rgba(9,34,65,0) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .card-eye .overlay-text .t {
    font-size: 24px; font-weight: 700; line-height: 1.1;
  }

  /* ----- Other attractions — image fills the stage, gradient panel overlays the bottom ----- */
  .card-att .img-stage {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  .card-att .img-stage > img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .card-att .panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 124px;
    padding: 32px 8px 8px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
  }
  .card-att .panel .t {
    font-size: 15px; font-weight: 700; line-height: 1.15;
  }
  .card-att .panel .s {
    font-size: 12px; font-weight: 400; line-height: 1.18;
  }
  /* Default card is navy — the media sits on top and the navy shows as a footer strip with the +.
     When selected the card turns white and the footer shows a blue REMOVE. */
  .card-att { background: var(--navy); }
  .card-att.selected { background: white; }
  .card-att .action {
    height: 44px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 0;
    outline: 0;
    width: 100%;
    padding: 0;
    flex-shrink: 0;
  }
  .card-att .action .plus svg {
    width: 24px; height: 24px;
    color: white;
  }
  .card-att .action .remove {
    color: var(--blue);
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .card-att .action .remove { display: none; }

  /* Selected state */
  .card-att.selected .action .plus { display: none; }
  .card-att.selected .action .remove { display: block; }

  /* Disabled state — flatten the card under a uniform grey wash so the image, gradient
     and text all read as inactive together. The + button becomes a plain grey circle. */
  .card-att.disabled { pointer-events: none; }
  .card-att.disabled .img-stage { opacity: 0.55; filter: grayscale(0.4); }
  .card-att.disabled::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    /* Stop the overlay where the + button strip starts so the button stays clean. */
    bottom: 44px;
    background: rgba(150, 158, 168, 0.45);
    border-radius: 8px 8px 0 0;
    pointer-events: none;
    z-index: 4;
  }
  .card-att.disabled .action .plus svg { color: var(--gray); }

  /* Selected dog-ear checkmark */
  .corner-check {
    position: absolute;
    top: 0; right: 0;
    width: 28px; height: 28px;
    display: none;
    z-index: 3;
    pointer-events: none;
  }
  .card-att.selected .corner-check { display: block; }

  /* ===== Sticky footer ===== */
  .sticky-footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: white;
    box-shadow: 0 -4px 4px rgba(0,0,0,0.05);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 20;
  }
  .sticky-footer.hidden { display: none; }

  .sel-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sel-thumb {
    width: 84px; height: 84px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    background: #ECECEC;
  }
  .sel-meta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sel-label {
    color: var(--text-sub);
    font-size: 16px;
    font-weight: 500;
  }
  .sel-title {
    color: black;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.2;
  }

  /* Grabber + "the more you add" banner + expandable Bundle list */
  .footer-grabber { width: 70px; height: 4px; background: #DDDDDD; border-radius: 100px; margin: 0 auto; cursor: pointer; }
  .pick-banner {
    position: relative; background: #F4F4F4; border-radius: 8px; padding: 8px 12px;
    border-left: 4px solid #1A1A1A; color: #1A1A1A; font-size: 14px; font-weight: 600; line-height: 1.4;
  }
  .pick-breakdown {
    max-height: 0; overflow: hidden; margin-top: -16px;
    transition: max-height 400ms cubic-bezier(0.4,0,0.2,1), margin-top 400ms cubic-bezier(0.4,0,0.2,1);
  }
  .sticky-footer.is-expanded .pick-breakdown { max-height: 300px; margin-top: 0; }
  .bd-section-title { font-size: 16px; font-weight: 600; color: #1A1A1A; margin-bottom: 4px; }
  .bd-bundle-list { margin: 0; padding-left: 18px; }
  .bd-bundle-list li { color: #7D8E98; font-size: 14px; line-height: 22px; }

  /* Collage (copied from bundle/checkout) */
  .thumb-collage {
    width: 100%; height: 100%;
    display: grid;
    position: relative;
  }
  .thumb-collage > img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    min-width: 0; min-height: 0;
  }
  .thumb-collage > img[data-id="tussauds"] { object-position: center top; }
  .thumb-collage-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .thumb-collage-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 > img:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  .thumb-collage-3 > img:nth-child(2) { grid-column: 1; grid-row: 2; }
  .thumb-collage-3 > img:nth-child(3) { grid-column: 2; grid-row: 2; }
  .thumb-collage-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 > img:nth-child(5) {
    position: absolute;
    width: 50%; height: 50%;
    top: 25%; left: 25%;
    border-radius: 50%;
  }

  .cta {
    height: 48px;
    background: var(--blue);
    color: white;
    border-radius: 8px;
    border: 0;
    font-family: 'Barlow', sans-serif;
    font-size: 18px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    width: 100%;
  }
  .cta:disabled { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
<div class="device">

  <!-- iOS status bar -->
  <div class="ios-status">
    <span class="time">9:41</span>
    <span class="icons">▌▌▌ 📶 🔋</span>
  </div>

  <!-- Merlin partner banner -->
  <a class="merlin-banner" href="index.html" aria-label="Back to London Eye home" style="text-decoration:none; display:block;">
    <img src="Merlin.png" alt="Merlin"/>
  </a>

  <!-- Header -->
  <nav class="nav">
    <button class="back" aria-label="Back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>London Eye + Attractions</h1>
    <div class="placeholder"></div>
  </nav>

  <div class="body">
    <div class="intro">
      <h2>Build your perfect visit</h2>
      <p>Pair your London Eye ticket with nearby attractions.</p>
    </div>

    <div class="grid" id="grid">
      <!-- London Eye (included) -->
      <article class="card card-eye included">
        <div class="img-wrap">
          <span class="badge">Included</span>
          <img src="London Eye Portrait.png" alt="London Eye" />
          <div class="overlay-text">
            <div class="t">London Eye</div>
          </div>
        </div>
      </article>

      <!-- Other attractions injected by JS -->
    </div>
  </div>

  <!-- Sticky footer -->
  <footer class="sticky-footer hidden" id="footer">
    <div class="footer-grabber" id="footer-grabber" role="button" aria-label="Toggle bundle details"></div>
    <div class="sel-row">
      <div class="sel-thumb">
        <div class="thumb-collage thumb-collage-1" id="footer-collage"></div>
      </div>
      <div class="sel-meta">
        <div class="sel-label">Your selection</div>
        <div class="sel-title" id="sel-title">London Eye + 1 attraction</div>
      </div>
    </div>
    <div class="pick-breakdown" id="pick-breakdown"></div>
    <div class="pick-banner" id="pick-banner">The more you add, the more you save</div>
    <button class="cta" id="continue-btn" onclick="proceed()">
      CONTINUE — FROM <span id="from-price">£49.00</span>
    </button>
  </footer>

</div>

<script>
  // ----- Catalogue (synced with bundle screen) -----
  const ATTRS = [
    {
      id: 'tussauds',
      title: 'Madame Tussauds',
      desc: 'Step into immersive sets and come face-to-face with incredibly lifelike celebrities.',
      img:  'Madame Tussauds.png',
      grad: '#6A0407',
    },
    {
      id: 'shreks',
      title: "Shrek's adventure",
      desc: 'Join a live, interactive fairy-tale journey filled with 4D effects, storytelling, and beloved characters.',
      img:  "Shrek's Adventure.png",
      grad: '#215732',
    },
    {
      id: 'sealife',
      title: 'SEA Life Aquarium',
      desc: 'Dive into an underwater world and get up close with sharks, rays, penguins, and vibrant marine life.',
      img:  'SEA Life Aquarium.png',
      grad: '#1D1F6B',
    },
    {
      id: 'dungeon',
      title: 'The London Dungeon',
      desc: "Experience London's darkest history through live actors, immersive sets, and special effects.",
      img:  'The London Dungeon.png',
      grad: '#222222',
    },
    {
      id: 'bigbus',
      title: 'Big Bus',
      desc: "Explore London's iconic landmarks at your own pace with panoramic views from an open-top bus.",
      img:  'Big Bus.png',
      grad: '#7E6941',
    },
  ];

  const IMG_BY_ID = {
    londoneye: 'London Eye Portrait.png',
    tussauds:  'Madame Tussauds.png',
    shreks:    "Shrek's Adventure.png",
    sealife:   'SEA Life Aquarium.png',
    dungeon:   'The London Dungeon.png',
    bigbus:    'Big Bus.png',
  };
  const TITLE_BY_ID = {
    tussauds: 'Madame Tussauds', shreks: "Shrek's adventure", sealife: 'SEA Life Aquarium',
    dungeon: 'The London Dungeon', bigbus: 'Big Bus',
  };

  // London Eye always included, +4 max secondaries → 5 attractions total.
  const MAX_SECONDARIES = 4;

  // Bundle pricing per attraction at each "level" (level = total #attractions
  // in the bundle = 1 + #secondaries). Mirrors the scheme used by schedule.html
  // and fever-bundle-prototype_1.html so the picker / plan / checkout all show
  // coherent numbers:
  //   1 secondary  (lvl 2) → £49        (any secondary)
  //   2 secondaries(lvl 3) → £57–£58    (depending on Big Bus inclusion)
  //   3 secondaries(lvl 4) → £63–£64
  //   4 secondaries(lvl 5) → £65–£69    (Big Bus pushes it up to £69)
  const LE_ADULT = 33;
  const SEC_PRICES = {
    tussauds: { 2: 16, 3: 12, 4: 10, 5:  8 },
    sealife:  { 2: 16, 3: 12, 4: 10, 5:  8 },
    shreks:   { 2: 16, 3: 12, 4: 10, 5:  8 },
    dungeon:  { 2: 16, 3: 12, 4: 10, 5:  8 },
    bigbus:   { 2: 16, 3: 13, 4: 11, 5: 12 },
  };

  function bundleAdultFor(selectedSet) {
    const arr = Array.from(selectedSet);
    if (arr.length === 0) return LE_ADULT;
    const lvl = 1 + arr.length;
    let sum = LE_ADULT;
    arr.forEach(id => {
      const p = SEC_PRICES[id];
      if (p && p[lvl] != null) sum += p[lvl];
    });
    return sum;
  }

  const selected = new Set();

  // ----- Render cards -----
  function renderCards() {
    const grid = document.getElementById('grid');
    // Keep the LE card already in DOM (first child); append others fresh.
    Array.from(grid.querySelectorAll('.card-att')).forEach(n => n.remove());

    ATTRS.forEach(a => {
      const card = document.createElement('article');
      card.className = 'card card-att';
      card.dataset.id = a.id;
      card.innerHTML = `
        <svg class="corner-check" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0 L28 0 L28 28 Z" fill="#092241"/>
          <path d="M18 8 L22 12 L14 20 L10 16 L12 14 L14 16 L20 10 Z" fill="#FFFFFF"/>
        </svg>
        <div class="img-stage">
          <img src="${a.img}" alt="${a.title}" />
          <div class="panel" style="background: linear-gradient(0deg, ${a.grad} 60%, ${hexToRgba(a.grad,0)} 100%);">
            <div class="t">${a.title}</div>
            <div class="s">${a.desc}</div>
          </div>
        </div>
        <button class="action" data-action="toggle" data-id="${a.id}">
          <span class="plus">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="remove">REMOVE</span>
        </button>
      `;
      grid.appendChild(card);
    });

    // Wire up click handlers
    grid.querySelectorAll('[data-action="toggle"]').forEach(btn => {
      btn.addEventListener('click', () => toggle(btn.dataset.id));
    });

    syncStates();
  }

  function hexToRgba(hex, a) {
    const v = hex.replace('#','');
    const r = parseInt(v.substring(0,2),16),
          g = parseInt(v.substring(2,4),16),
          b = parseInt(v.substring(4,6),16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  function syncStates() {
    const max = selected.size >= MAX_SECONDARIES;
    ATTRS.forEach(a => {
      const card = document.querySelector(`.card-att[data-id="${a.id}"]`);
      if (!card) return;
      const isSel = selected.has(a.id);
      const isDis = !isSel && max;
      card.classList.toggle('selected', isSel);
      card.classList.toggle('disabled', isDis);
    });
    renderFooter();
  }

  function toggle(id) {
    if (selected.has(id)) {
      selected.delete(id);
    } else {
      if (selected.size >= MAX_SECONDARIES) return;
      selected.add(id);
    }
    syncStates();
  }

  // ----- Footer -----
  function renderFooter() {
    const n = selected.size;
    const footer = document.getElementById('footer');
    const body = document.querySelector('.body');
    if (n === 0) {
      footer.classList.add('hidden');
      if (body) body.classList.remove('has-footer');
      return;
    }
    footer.classList.remove('hidden');
    if (body) body.classList.add('has-footer');

    // Title
    document.getElementById('sel-title').textContent =
      `London Eye + ${n} attraction${n === 1 ? '' : 's'}`;

    // From price — computed against the actual selected attractions so the
    // footer total stays coherent with the schedule and checkout views.
    const price = bundleAdultFor(selected);
    document.getElementById('from-price').textContent = `£${price.toFixed(2)}`;

    // Collage (London Eye + selected secondaries, in selection order)
    const ids = ['londoneye', ...Array.from(selected)];
    const collageEl = document.getElementById('footer-collage');
    collageEl.className = `thumb-collage thumb-collage-${ids.length}`;
    collageEl.innerHTML = ids.map(id =>
      `<img src="${IMG_BY_ID[id]}" data-id="${id}" alt="" />`
    ).join('');

    // Banner copy: grows the nudge until the bundle is maxed out.
    document.getElementById('pick-banner').textContent =
      n >= MAX_SECONDARIES ? 'Biggest discount unlocked' : 'The more you add, the more you save';

    // Expandable Bundle breakdown (London Eye + selected attractions, by name).
    const names = ['London Eye', ...Array.from(selected).map(id => TITLE_BY_ID[id])];
    document.getElementById('pick-breakdown').innerHTML =
      `<div class="bd-section-title">Bundle</div><ul class="bd-bundle-list">${names.map(nm => `<li>${nm}</li>`).join('')}</ul>`;
  }

  // ----- Navigation -----
  function proceed() {
    // Persist the selection so the next page (schedule) knows the bundle composition.
    const payload = {
      mode: 'multi',
      attractions: ['londoneye', ...Array.from(selected)],
      ts: Date.now(),
    };
    try { localStorage.setItem('feverPickerSelection', JSON.stringify(payload)); } catch (e) {}
    nav('schedule.html');
  }

  function goBack() {
    // Architecture: landing → attraction picker → …, so back always returns to the landing page.
    nav('index.html');
  }

  // Navigate with a cache-buster so in-app transitions never serve a stale cached page.
  function nav(url) { window.location.href = (location.protocol === 'file:') ? url : url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now(); }

  // Expand/collapse the footer to reveal the Bundle breakdown.
  (function () {
    const g = document.getElementById('footer-grabber');
    const toggle = () => document.getElementById('footer').classList.toggle('is-expanded');
    if (g) g.addEventListener('click', toggle);
    const thumb = document.querySelector('.sel-thumb');
    if (thumb) thumb.addEventListener('click', toggle);
  })();

  // ----- Init -----
  // Restore a prior selection (e.g. returning here from the plan view) so the attractions
  // the user already picked stay selected. index.html clears this on a fresh session.
  try {
    const prev = JSON.parse(localStorage.getItem('feverPickerSelection') || 'null');
    if (prev && prev.mode === 'multi' && Array.isArray(prev.attractions)) {
      prev.attractions
        .filter(id => id !== 'londoneye')
        .slice(0, MAX_SECONDARIES)
        .forEach(id => selected.add(id));
    }
  } catch (e) {}
  renderCards();
</script>
</body>
