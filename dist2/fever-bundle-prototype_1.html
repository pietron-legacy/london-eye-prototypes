<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>window.addEventListener("pageshow",function(e){if(e.persisted)location.reload();});</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fever — Add now and save</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --eye-text-black: #1A1A1A;
    --eye-text-secondary: #8C8C8C;
    --eye-background-white: #FFFFFF;
    --eye-background-gray: #E8E8E8;
    --eye-action-primary: #3A6FA0;
    --eye-action-gray: #CED3D9;
    --eye-action-selected: #D3E3F1;
    --eye-action-secondary: #092241;
    --page-bg: #FFFFFF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Barlow', sans-serif; }
  html, body {
    margin: 0; padding: 0;
    background: #d8d8d8;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px 0; }

  .device {
    width: 393px; height: 852px;
    background: var(--page-bg);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08);
  }

  /* Full-bleed phone on small screens. */
  @media (max-width: 430px) {
    body { background:#fff; padding:0; align-items:stretch; }
    .device { width:100%; height:100dvh; border-radius:0; box-shadow:none; }
  }

  .ios-status {
    height: 58px; padding: 21px 16px 0; background: white;
    display: flex; align-items: center; justify-content: space-between;
    font-family: -apple-system, 'SF Pro', Inter, sans-serif; flex-shrink: 0;
  }
  .ios-status .time { font-size: 17px; font-weight: 590; }
  .ios-status .icons { display: flex; gap: 7px; align-items: center; font-size: 13px; }

  .merlin-banner { background: #092241; text-align: center; padding: 8px 0; flex-shrink: 0; }
  .merlin-banner img { height: 16px; display: inline-block; vertical-align: middle; }

  /* ===== Sheet ===== */
  .sheet {
    background: white;
    box-shadow: 0 -6px 6px rgba(0,70,121,0.20);
    flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 7px;
  }
  /* Header matches the add-ons page: centred 18px/700 title, 36px back/placeholder. */
  .sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .sheet-header .placeholder { width: 36px; height: 36px; }
  .sheet-header .title { flex: 1; text-align: center; color: #000; font-size: 18px; font-weight: 700; line-height: 18px; }
  .sheet-header .back {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: transparent; border: 0; color: #000; padding: 0;
  }
  .sheet-header .back svg { width: 24px; height: 24px; }
  /* Step 2 of 2 (attractions upsell) — matches the add-ons page stepper. */
  .stepper { display: flex; gap: 8px; padding: 0 16px 16px; }
  .stepper .seg { flex: 1 1 0; height: 4px; border-radius: 100px; background: var(--eye-background-gray); }
  .stepper .seg.done { background: #BCC1CA; }

  /* Intro is a callout: light-grey box with a black accent bar on the left. */
  .sheet-intro { margin: 16px 0; text-align: left; color: var(--eye-text-black); font-size: 16px; font-weight: 400; line-height: 1.4;
    background: #F4F4F4; border-radius: 8px; padding: 8px 12px; border-left: 4px solid var(--eye-text-black); }
  .sheet-intro strong { font-weight: 700; }

  .cards-scroll { flex: 1; overflow-y: auto; padding: 0 16px 320px 16px; scroll-behavior: smooth; }
  .cards-scroll::-webkit-scrollbar { display: none; }
  .cards-scroll { scrollbar-width: none; }

  /* ===== Attraction card ===== */
  .card { position: relative; border-radius: 16px; border: 1px solid var(--eye-action-gray); overflow: hidden; margin-bottom: 16px; background: white; }
  /* When an attraction is added the card collapses to a minimal state: the image band
     shrinks and the description fades out, leaving just the title + "Added!" strip.
     Transitioning the visual's height makes the card — and every card below it — slide
     up smoothly. */
  .card-visual { position: relative; height: 120px; overflow: hidden; transition: height 400ms cubic-bezier(0.4,0,0.2,1); }
  .card.is-added .card-visual { height: 64px; }
  .card-visual img { position: absolute; right: 0; top: 0; height: 100%; width: auto; display: block; }
  .card-visual .gradient { position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; z-index: 1; }
  .card-visual .gradient h3 { margin: 0; color: white; font-size: 22px; font-weight: 700; line-height: 1.05; letter-spacing: -0.2px; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .card-visual .gradient p { margin: 0; color: white; font-size: 12px; font-weight: 400; line-height: 1.25; width: 60%; max-height: 60px; overflow: hidden; transition: opacity 220ms ease, max-height 400ms cubic-bezier(0.4,0,0.2,1); }
  .card.is-added .card-visual .gradient p { opacity: 0; max-height: 0; }

  .card[data-id="tussauds"] .card-visual { background: #6A0407; }
  .card[data-id="sealife"]  .card-visual { background: #1D1F6B; }
  .card[data-id="shreks"]   .card-visual { background: #215732; }
  .card[data-id="dungeon"]  .card-visual { background: #222222; }
  .card[data-id="bigbus"]   .card-visual { background: #7E6941; }
  .card[data-id="tussauds"] .gradient { background: linear-gradient(90deg, #6A0407 68%, rgba(106,4,7,0) 100%); }
  .card[data-id="sealife"]  .gradient { background: linear-gradient(90deg, #1D1F6B 73%, rgba(29,31,107,0) 100%); }
  .card[data-id="shreks"]   .gradient { background: linear-gradient(90deg, #215732 72%, rgba(33,87,50,0) 100%); }
  .card[data-id="dungeon"]  .gradient { background: linear-gradient(90deg, #222222 72%, rgba(34,34,34,0) 100%); }
  .card[data-id="bigbus"]   .gradient { background: linear-gradient(90deg, #7E6941 72%, rgba(126,105,65,0) 100%); }
  /* When added/collapsed, the solid colour extends further (longer gradient), so only a thin
     sliver of the image peeks on the right. */
  .card.is-added[data-id="tussauds"] .gradient { background: linear-gradient(90deg, #6A0407 80%, rgba(106,4,7,0) 100%); }
  .card.is-added[data-id="sealife"]  .gradient { background: linear-gradient(90deg, #1D1F6B 80%, rgba(29,31,107,0) 100%); }
  .card.is-added[data-id="shreks"]   .gradient { background: linear-gradient(90deg, #215732 80%, rgba(33,87,50,0) 100%); }
  .card.is-added[data-id="dungeon"]  .gradient { background: linear-gradient(90deg, #222222 80%, rgba(34,34,34,0) 100%); }
  .card.is-added[data-id="bigbus"]   .gradient { background: linear-gradient(90deg, #7E6941 80%, rgba(126,105,65,0) 100%); }

  .card-strip-area { position: relative; min-height: 48px; background: white; }
  .card-strip { background: white; padding: 10px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  /* Two stacked price columns: struck "Separately" anchor + the "Bundled" price. */
  .price-cols { display: flex; align-items: center; gap: 12px; }
  .price-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sep-amt { color: var(--eye-text-secondary); font-size: 14px; text-decoration: line-through; line-height: 12px; }
  .sep-lbl { color: var(--eye-text-secondary); font-size: 10px; line-height: 10px; }
  .bundled-amt { color: var(--eye-text-black); font-size: 16px; font-weight: 600; line-height: 14px; }
  .bundled-lbl { color: var(--eye-text-black); font-size: 10px; font-weight: 500; line-height: 10px; }
  .add-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--eye-action-secondary); border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 150ms ease-out, background 150ms; flex-shrink: 0; }
  .add-btn:not(.disabled):active { transform: scale(0.9); }
  .add-btn svg { width: 18px; height: 18px; color: white; }
  .add-btn.disabled { background: var(--eye-action-gray); cursor: not-allowed; opacity: 0.7; }
  /* Right-hand group: ticket count + add button. */
  .card-actions { display: flex; align-items: center; gap: 12px; }
  .card-ticket-count { display: flex; align-items: center; gap: 4px; color: var(--eye-text-secondary); font-size: 18px; line-height: 1; }
  .card-ticket-count svg { flex-shrink: 0; }

  .added-strip { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: white; }
  .added-label { color: var(--eye-text-black); font-size: 16px; font-weight: 600; }
  .remove-btn { background: none; border: 0; color: var(--eye-action-primary); font-size: 16px; font-weight: 400; letter-spacing: 0.3px; cursor: pointer; padding: 4px 8px; text-transform: uppercase; }
  .limit-strip { display: flex; justify-content: flex-start; align-items: center; padding: 10px 16px; background: white; }
  .limit-label { color: var(--eye-text-secondary); font-size: 16px; font-weight: 600; }

  /* ===== Footer (bottom sheet) ===== */
  .footer {
    position: absolute; bottom: 0; left: 0; right: 0; background: white;
    box-shadow: 0 -6px 6px rgba(0,70,121,0.20);
    padding: 16px; display: flex; flex-direction: column; gap: 16px; z-index: 10;
  }
  .footer-grabber { width: 70px; height: 4px; background: #DDDDDD; border-radius: 100px; margin: 0 auto; cursor: pointer; }

  /* Discount badge — a grey callout with a black accent bar. Always visible: it shows the
     current bundled saving (e.g. -78%) and grows as more attractions are added. */
  /* Fixed height so swapping variants (and the roulette roll) never reflows/expands the box.
     Padding lives on .badge-inner (not the badge) so roll overlays align exactly — no shift. */
  .discount-badge {
    height: 64px; background: #F4F4F4; border-radius: 8px; border-left: 4px solid var(--eye-text-black);
    position: relative; overflow: hidden;
  }
  .badge-inner { display: flex; align-items: center; gap: 8px; height: 100%; padding: 8px 12px; }
  /* When the sheet is expanded the full breakdown is visible, so the promo callout is hidden. */
  .footer.is-expanded .discount-badge { display: none; }
  .discount-badge .pct { color: var(--eye-text-black); font-size: 36px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .discount-badge .copy { display: flex; flex-direction: column; gap: 1px; }
  .discount-badge .copy.grow { flex: 1 1 0; }
  .discount-badge .copy .l1 { color: var(--eye-text-black); font-size: 14px; font-weight: 600; }
  .discount-badge .copy .l2 { color: var(--eye-text-black); font-size: 14px; font-weight: 400; }
  /* "SAVED £X" cluster shown once at least one attraction is added. */
  .discount-badge .saved { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; line-height: 1; }
  .discount-badge .saved .saved-lbl { color: var(--eye-text-black); font-size: 14px; font-weight: 800; }
  .discount-badge .saved .saved-amt { color: var(--eye-text-black); font-weight: 800; line-height: 29px; }
  .discount-badge .saved .saved-amt .cur { font-size: 16px; }
  .discount-badge .saved .saved-amt .val { font-size: 32px; }

  .footer-top { display: flex; align-items: center; gap: 16px; }
  .footer-thumb { width: 84px; height: 84px; border-radius: 8px; flex-shrink: 0; overflow: hidden; background: #ECE3D3; position: relative; }
  .footer-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .footer-summary-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .footer-pretitle { color: var(--eye-text-secondary); font-size: 16px; font-weight: 500; line-height: 1.2; }
  .footer-contents { color: var(--eye-text-black); font-size: 20px; font-weight: 600; line-height: 1.2; }
  .footer-ticket-count { display: flex; align-items: center; gap: 4px; color: var(--eye-text-secondary); font-size: 20px; line-height: 1.2; margin-top: 2px; }
  .footer-ticket-count svg { flex-shrink: 0; }

  /* Expandable breakdown.
     When collapsed the drawer has 0 height, but as a flex child it would still
     contribute a 16px gap on EACH side — leaving ~32px between the selection and
     the CTA. The negative top margin cancels the gap above it while collapsed, so
     the only gap left below the selection is the single 16px before the next item. */
  /* Breakdown — same structure as the add-ons page: Tickets recap → London Eye + date → line items. */
  .footer-breakdown { max-height: 0; overflow: hidden; margin-top: -16px; transition: max-height 420ms cubic-bezier(0.4,0,0.2,1), margin-top 420ms cubic-bezier(0.4,0,0.2,1); }
  .footer.is-expanded .footer-breakdown { max-height: 480px; margin-top: 0; }
  .bd-divider { height: 1px; background: var(--eye-background-gray); margin: 0 0 16px; }
  .bd-section-title { font-size: 16px; font-weight: 600; color: var(--eye-text-black); margin-bottom: 4px; }
  .bd-ticket-line { font-size: 14px; font-weight: 600; color: #7D8E98; line-height: 20px; }
  .bd-tickets { margin-bottom: 16px; }
  .bd-priced + .bd-priced { margin-top: 16px; }
  .bd-row { display: flex; justify-content: space-between; align-items: baseline; }
  .bd-row .name, .bd-row .amount { font-size: 16px; font-weight: 600; color: var(--eye-text-black); }
  .bd-eye-date { font-size: 14px; font-style: italic; color: #7D8E98; margin-top: 2px; }
  /* Bundle line groups all added attractions: sum + "Schedule after purchase" + bulleted names. */
  .bd-bundle-list { margin: 4px 0 0; padding-left: 18px; }
  .bd-bundle-list li { color: #7D8E98; font-size: 14px; line-height: 20px; }

  /* Rolling-number span — used by the count-up animation on price/percent changes. */
  .rn { display: inline-block; }

  .continue-btn { width: 100%; height: 48px; background: var(--eye-action-primary); color: white; font-size: 20px; font-weight: 400; border: 0; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; }
  .continue-btn:active { opacity: 0.85; }

  /* Footer thumb collage — Eye is always first, secondaries fill the rest in pick order. */
  .thumb-collage { width: 100%; height: 100%; display: grid; position: relative; }
  .thumb-collage > img { width: 100%; height: 100%; object-fit: cover; display: block; min-width: 0; min-height: 0; }
  .thumb-collage-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .thumb-collage-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 > img:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  .thumb-collage-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 > img:nth-child(5) { position: absolute; width: 50%; height: 50%; top: 25%; left: 25%; border-radius: 50%; }
  .thumb-collage > img[data-id="tussauds"] { object-position: center top; }
</style>
</head>
<body>
<div class="device">
  <div class="ios-status">
    <span class="time">9:41</span>
    <span class="icons">▌▌▌ 📶 🔋</span>
  </div>
  <a class="merlin-banner" href="index.html" aria-label="Back to London Eye home" style="text-decoration:none; display:block;">
    <img src="Merlin.png" alt="Merlin"/>
  </a>

  <div class="sheet">
    <div class="sheet-header">
      <button class="back" aria-label="Back" onclick="nav('addons.html')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">Add now and save</div>
      <div class="placeholder"></div>
    </div>
    <div class="stepper"><div class="seg done"></div><div class="seg done"></div></div>

    <div class="cards-scroll" id="cards-scroll">
      <p class="sheet-intro">
        Combine London Eye tickets with top attractions. <strong>You can schedule them after purchase.</strong>
      </p>
      <div id="cards-list"><!-- Cards injected by JS --></div>
    </div>

    <div class="footer" id="footer">
      <div class="footer-grabber" id="footer-grabber" role="button" aria-label="Toggle bundle details"></div>

      <div class="footer-top">
        <div class="footer-thumb" id="footer-thumb"></div>
        <div class="footer-summary-info">
          <div class="footer-pretitle">Your selection</div>
          <div class="footer-contents" id="footer-contents">London Eye - Standard ticket</div>
          <div class="footer-ticket-count">
            <svg width="22" height="22" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.625 7C4.625 6.53516 5.00781 6.125 5.5 6.125H12.5C12.9648 6.125 13.375 6.53516 13.375 7V10.5C13.375 10.9922 12.9648 11.375 12.5 11.375H5.5C5.00781 11.375 4.625 10.9922 4.625 10.5V7ZM5.5 10.5H12.5V7H5.5V10.5ZM16.875 5.25V7.4375C16.1367 7.4375 15.5625 8.03906 15.5625 8.75C15.5625 9.48828 16.1367 10.0625 16.875 10.0625V12.25C16.875 13.2344 16.082 14 15.125 14H2.875C1.89062 14 1.125 13.2344 1.125 12.25V10.0625C1.83594 10.0625 2.4375 9.48828 2.4375 8.75C2.4375 8.03906 1.83594 7.4375 1.125 7.4375V5.25C1.125 4.29297 1.89062 3.5 2.875 3.5H15.125C16.082 3.5 16.875 4.29297 16.875 5.25ZM2 6.75391C2.76562 7.08203 3.3125 7.875 3.3125 8.75C3.3125 9.65234 2.76562 10.418 2 10.7734V12.25C2 12.7422 2.38281 13.125 2.875 13.125H15.125C15.5898 13.125 16 12.7422 16 12.25V10.7734C15.207 10.418 14.6875 9.65234 14.6875 8.75C14.6875 7.875 15.207 7.08203 16 6.75391V5.25C16 4.78516 15.5898 4.375 15.125 4.375H2.875C2.38281 4.375 2 4.78516 2 5.25V6.75391Z" fill="#8C8C8C"/></svg>
            <span id="footer-ticket-count">x 5</span>
          </div>
        </div>
      </div>

      <!-- Discount callout — always visible, sits below the selection. Two variants:
           0 added → "-78% / Pick one to increase the discount"; ≥1 added → "Keep adding… / SAVED £X". -->
      <div class="discount-badge" id="discount-badge"></div>

      <div class="footer-breakdown" id="footer-breakdown"></div>
      <button class="continue-btn" id="continue-btn" onclick="goToCheckout()"><span id="continue-btn-text">TO PAYMENT - £126.00</span></button>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  //  INFERRED PRICING MODEL  (derived from the three reference screenshots)
  // =========================================================================
  //  London Eye standard ticket  ...... £126.00 fixed (the "x 5" selection)
  //  Each secondary attraction:
  //    - regular / anchor price  ....... £148.00  (struck-through on each card)
  //    - bundle price is a flat GROUP price that DROPS as the plan grows:
  //        1 attraction in plan -> £33 each
  //        2 attractions        -> £28 each
  //        3 attractions        -> £24 each
  //        4 attractions        -> £21 each
  //      (London Eye + up to 4 secondaries = 5 attractions max.)
  //
  //  Display rule: a card that is NOT yet added shows the price it WOULD cost
  //  if added next, i.e. PRICE[currentlyAdded + 1].
  //    0 added -> every card shows £33   (matches screenshot 1)
  //    1 added -> remaining cards £28    (matches screenshot 2 — Tussauds £28)
  //  Added attractions are all billed at PRICE[currentlyAdded], so adding more
  //  retro-discounts the ones already in the plan ("the more you add, the more
  //  you save"). With 1 added: SEA Life billed £33, total £159, saving £115.
  //
  //  DISCOUNT BADGE (the new element): a headline percentage that grows with
  //  the plan size. Tuned so the first attraction reads -27% (as in the mock).
  // =========================================================================

  const LONDON_EYE_PRICE  = 126;          // fixed standard-ticket total
  const MAX_SECONDARIES   = 4;            // London Eye + up to 4 = 5 attractions
  // "Separately" (anchor) vs "Bundled" price. The bundled price drops as the plan grows,
  // so every attraction in the plan gets cheaper the more you add. Most share STD_BUNDLED
  // (anchor £148); Big Bus is a pricier attraction (anchor £158). These figures are quoted for
  // the REFERENCE PARTY (2 adults + 2 children + 1 under-2) and are scaled to the actual party
  // by PARTY_SCALE (see below) — anchorPrice()/bundledPrice() apply that scaling.
  const STD_BUNDLED = { 1: 33, 2: 28, 3: 24, 4: 21 };
  const BUS_BUNDLED = { 1: 43, 2: 38, 3: 34, 4: 31 };

  const ATTRACTIONS = [
    { id: 'tussauds', name: 'Madame Tussauds',    image: 'Madame Tussauds.png',    description: 'Step into immersive sets and come face-to-face with incredibly lifelike celebrities.', anchor: 148, bundled: STD_BUNDLED },
    { id: 'sealife',  name: 'SEA Life Aquarium',  image: 'SEA Life Aquarium.png',  description: 'Dive into an underwater world and get up close with sharks, rays, penguins, and vibrant marine life.', anchor: 148, bundled: STD_BUNDLED },
    { id: 'shreks',   name: "Shrek's adventure",  image: "Shrek's Adventure.png",  description: 'Join a live, interactive fairy-tale journey filled with 4D effects, storytelling, and beloved characters.', anchor: 148, bundled: STD_BUNDLED },
    { id: 'dungeon',  name: 'The London Dungeon', image: 'The London Dungeon.png', description: "Experience London's darkest history through thrilling live actors, immersive sets, and spine-chilling special effects.", anchor: 148, bundled: STD_BUNDLED },
    { id: 'bigbus',   name: 'Big Bus',            image: 'Big Bus.png',            description: "Explore London's iconic landmarks at your own pace with panoramic views from an open-top bus.", anchor: 158, bundled: BUS_BUNDLED },
  ];

  const TICKET_SVG = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.625 7C4.625 6.53516 5.00781 6.125 5.5 6.125H12.5C12.9648 6.125 13.375 6.53516 13.375 7V10.5C13.375 10.9922 12.9648 11.375 12.5 11.375H5.5C5.00781 11.375 4.625 10.9922 4.625 10.5V7ZM5.5 10.5H12.5V7H5.5V10.5ZM16.875 5.25V7.4375C16.1367 7.4375 15.5625 8.03906 15.5625 8.75C15.5625 9.48828 16.1367 10.0625 16.875 10.0625V12.25C16.875 13.2344 16.082 14 15.125 14H2.875C1.89062 14 1.125 13.2344 1.125 12.25V10.0625C1.83594 10.0625 2.4375 9.48828 2.4375 8.75C2.4375 8.03906 1.83594 7.4375 1.125 7.4375V5.25C1.125 4.29297 1.89062 3.5 2.875 3.5H15.125C16.082 3.5 16.875 4.29297 16.875 5.25ZM2 6.75391C2.76562 7.08203 3.3125 7.875 3.3125 8.75C3.3125 9.65234 2.76562 10.418 2 10.7734V12.25C2 12.7422 2.38281 13.125 2.875 13.125H15.125C15.5898 13.125 16 12.7422 16 12.25V10.7734C15.207 10.418 14.6875 9.65234 14.6875 8.75C14.6875 7.875 15.207 7.08203 16 6.75391V5.25C16 4.78516 15.5898 4.375 15.125 4.375H2.875C2.38281 4.375 2 4.78516 2 5.25V6.75391Z" fill="#8C8C8C"/></svg>`;

  // Tickets/date carried over from the schedule page (read once on load).
  // Falls back to the screenshot defaults (£126 London Eye, 5 tickets) when absent.
  const DEFAULT_TICKETS = [
    { name: 'Adult (16+)', qty: 2, price: 63 },
    { name: 'Child (2 - 15 Years)', qty: 2, price: 0 },
    { name: 'Under 2', qty: 1, price: 0 },
  ];
  // Present-day default so the prototype is never stuck on a fixed date.
  const _t = new Date();
  const TODAY = `${_t.toLocaleDateString('en-GB', { weekday: 'long' })}, ${_t.getDate()} ${_t.toLocaleDateString('en-GB', { month: 'short' })}`;
  let carry = { tickets: DEFAULT_TICKETS, addons: [], total: LONDON_EYE_PRICE, ticketCount: 5, date: TODAY, timeslot: '10:00 AM' };
  try {
    const raw = localStorage.getItem('feverScheduleCarry');
    if (raw) {
      const c = JSON.parse(raw);
      const tCount = (c.tickets || []).reduce((s, t) => s + (t.qty || 0), 0);
      carry = {
        tickets: (c.tickets && c.tickets.length) ? c.tickets : DEFAULT_TICKETS,
        addons:  c.addons  || [],
        total:   (c.tickets || []).reduce((s, t) => s + (t.qty || 0) * (t.price || 0), 0) || LONDON_EYE_PRICE,
        ticketCount: tCount || 5,
        date: c.date || TODAY, timeslot: c.timeslot || '10:00 AM',
      };
    }
  } catch (e) { /* localStorage blocked — use defaults */ }

  const londonEyeBase = carry.total;
  const ticketCount   = carry.ticketCount;
  const addonsTotal   = (carry.addons || []).reduce((s, a) => s + (a.qty || 0) * (a.unit || 0), 0);

  // ===== PARTY-SIZE SCALING =====
  // The documented secondary prices (anchor £148/£158 and the bundled tiers) were quoted for the
  // reference party: 2 adults + 2 children + 1 under-2. We express a party as a weighted headcount
  // (adult = 1, child = CHILD_RATIO, under-2 & carer = free) and scale every secondary price by the
  // current party's weight ÷ the reference weight, so the upsell tracks the tickets actually chosen.
  const CHILD_RATIO = 30 / 33;                  // London Eye adult £33 / child £30
  const REF_WEIGHT  = 2 + 2 * CHILD_RATIO;      // 2 adults + 2 children (+ free under-2)
  function partyWeight() {
    return (carry.tickets || []).reduce((w, t) => {
      const nm = (t.name || '').toLowerCase();
      if (nm.startsWith('adult')) return w + (t.qty || 0);
      if (nm.startsWith('child')) return w + (t.qty || 0) * CHILD_RATIO;
      return w; // under 2 / carer ride free
    }, 0);
  }
  const PARTY_SCALE = (REF_WEIGHT && partyWeight() > 0) ? partyWeight() / REF_WEIGHT : 1;
  // Party-scaled "separately" anchor for a secondary attraction.
  function anchorPrice(attr) { return Math.round(attr.anchor * PARTY_SCALE); }

  // ===== STATE =====
  const added = new Set(); // attraction ids currently in the plan (free order)

  // ===== DERIVED =====
  const clampN = n => Math.max(1, Math.min(MAX_SECONDARIES, n));
  // Bundled price for an attraction given how many secondaries are in the plan.
  function bundledPrice(attr, n) { return Math.round(attr.bundled[clampN(n)] * PARTY_SCALE); }
  // Un-added cards show what they'd cost if added next (one more secondary).
  function displayCount() { return added.size + 1; }
  function addedInOrder() { return Array.from(added).map(id => ATTRACTIONS.find(a => a.id === id)); }

  function secondariesTotal() { const n = added.size; return addedInOrder().reduce((s, a) => s + bundledPrice(a, n), 0); }
  function totalPrice() { return londonEyeBase + secondariesTotal() + addonsTotal; }
  function savedAmount() { const n = added.size; return addedInOrder().reduce((s, a) => s + (anchorPrice(a) - bundledPrice(a, n)), 0); }
  // Headline discount shown on the badge — the standard attraction's bundled saving
  // (£148 → current tier). Grows as the plan grows; shown even before anything is picked.
  function discountPct() { return Math.round((148 - STD_BUNDLED[clampN(Math.max(1, added.size))]) / 148 * 100); }

  function bundleContentsText() {
    if (added.size === 0) return 'London Eye - Standard ticket';
    return `London Eye + ${added.size} attraction${added.size > 1 ? 's' : ''}`;
  }

  // ===== RENDER =====
  // Markup for a card's bottom strip given the current state.
  function stripHTML(attr) {
    const isAdded = added.has(attr.id);
    const isLimited = !isAdded && added.size >= MAX_SECONDARIES;
    if (isAdded) {
      return `<div class="added-strip">
            <span class="added-label">Added!</span>
            <button class="remove-btn" data-action="remove" data-id="${attr.id}">Remove</button>
          </div>`;
    }
    if (isLimited) {
      return `<div class="limit-strip"><span class="limit-label">Bundle limit reached</span></div>`;
    }
    const bundled = bundledPrice(attr, displayCount());
    return `<div class="card-strip">
            <div class="price-cols">
              <div class="price-col">
                <span class="sep-amt">£${anchorPrice(attr)}.00</span>
                <span class="sep-lbl">Separately</span>
              </div>
              <div class="price-col">
                <span class="bundled-amt rn" data-key="price-${attr.id}" data-pre="£" data-suf=".00" data-val="${bundled}">£${bundled}.00</span>
                <span class="bundled-lbl">Bundled</span>
              </div>
            </div>
            <div class="card-actions">
              <span class="card-ticket-count">
                <svg width="22" height="22" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.625 7C4.625 6.53516 5.00781 6.125 5.5 6.125H12.5C12.9648 6.125 13.375 6.53516 13.375 7V10.5C13.375 10.9922 12.9648 11.375 12.5 11.375H5.5C5.00781 11.375 4.625 10.9922 4.625 10.5V7ZM5.5 10.5H12.5V7H5.5V10.5ZM16.875 5.25V7.4375C16.1367 7.4375 15.5625 8.03906 15.5625 8.75C15.5625 9.48828 16.1367 10.0625 16.875 10.0625V12.25C16.875 13.2344 16.082 14 15.125 14H2.875C1.89062 14 1.125 13.2344 1.125 12.25V10.0625C1.83594 10.0625 2.4375 9.48828 2.4375 8.75C2.4375 8.03906 1.83594 7.4375 1.125 7.4375V5.25C1.125 4.29297 1.89062 3.5 2.875 3.5H15.125C16.082 3.5 16.875 4.29297 16.875 5.25ZM2 6.75391C2.76562 7.08203 3.3125 7.875 3.3125 8.75C3.3125 9.65234 2.76562 10.418 2 10.7734V12.25C2 12.7422 2.38281 13.125 2.875 13.125H15.125C15.5898 13.125 16 12.7422 16 12.25V10.7734C15.207 10.418 14.6875 9.65234 14.6875 8.75C14.6875 7.875 15.207 7.08203 16 6.75391V5.25C16 4.78516 15.5898 4.375 15.125 4.375H2.875C2.38281 4.375 2 4.78516 2 5.25V6.75391Z" fill="#8C8C8C"/></svg>
                x${ticketCount}
              </span>
              <button class="add-btn" data-action="add" data-id="${attr.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
          </div>`;
  }

  // Build all cards ONCE. The card elements persist across state changes so that
  // CSS transitions (collapse, layout shift) can run — only their strip content and
  // is-added class are updated afterwards.
  function buildCards() {
    const list = document.getElementById('cards-list');
    list.innerHTML = '';
    ATTRACTIONS.forEach(attr => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = attr.id;
      card.innerHTML = `
        <div class="card-visual">
          <img src="${attr.image}" alt="" />
          <div class="gradient"><h3>${attr.name}</h3><p>${attr.description}</p></div>
        </div>
        <div class="card-strip-area">${stripHTML(attr)}</div>`;
      list.appendChild(card);
    });
    fitCardTitles();
  }

  // Update the persistent cards in place: toggle the collapsed (is-added) state and
  // refresh each strip's content (the roll + number animations are applied separately).
  function refreshCards() {
    document.querySelectorAll('.card').forEach(card => {
      const attr = ATTRACTIONS.find(a => a.id === card.dataset.id);
      card.classList.toggle('is-added', added.has(attr.id));
      const sa = card.querySelector('.card-strip-area');
      const next = stripHTML(attr);
      if (sa.innerHTML !== next) sa.innerHTML = next;
    });
  }

  function fitCardTitles() {
    document.querySelectorAll('.card-visual h3').forEach(h3 => {
      h3.style.fontSize = '';
      const card = h3.closest('.card');
      if (!card) return;
      const softMax = card.getBoundingClientRect().width * 0.88;
      let size = parseFloat(getComputedStyle(h3).fontSize), i = 0;
      while (h3.scrollWidth > softMax && size > 16 && i++ < 24) { size -= 0.5; h3.style.fontSize = size + 'px'; }
    });
  }

  function renderThumbCollage() {
    const cells = [
      `<img src="London Eye.jpg" alt="London Eye" data-id="eye" />`,
      ...addedInOrder().map(a => `<img src="${a.image}" alt="${a.name}" data-id="${a.id}" />`),
    ];
    return `<div class="thumb-collage thumb-collage-${cells.length}">${cells.join('')}</div>`;
  }

  // Same structure as the add-ons page: Tickets recap → divider → London Eye + date,
  // then attraction & add-on line items. No total row — the CTA carries the total.
  function renderBreakdown() {
    const el = document.getElementById('footer-breakdown');
    const n = added.size;
    const ticketLines = (carry.tickets || [])
      .filter(t => (t.qty || 0) > 0)
      .map(t => `<div class="bd-ticket-line">${t.name} x ${t.qty}</div>`).join('');

    const rows = [];
    rows.push(`<div class="bd-divider"></div>`);
    rows.push(`<div class="bd-tickets"><div class="bd-section-title">Tickets</div>${ticketLines}</div>`);
    rows.push(`<div class="bd-divider"></div>`);
    rows.push(`<div class="bd-priced">
        <div class="bd-row"><span class="name">London Eye</span><span class="amount">£${londonEyeBase}.00</span></div>
        <div class="bd-eye-date">${carry.date} - ${carry.timeslot}</div>
      </div>`);
    // All added attractions are grouped into a single "Bundle" line: their combined
    // bundled price, a "Schedule after purchase" note, and a bulleted list of names.
    if (n > 0) {
      const bundleTotal = secondariesTotal();
      const names = addedInOrder().map(a => `<li>${a.name}</li>`).join('');
      rows.push(`<div class="bd-priced">
          <div class="bd-row"><span class="name">Bundle</span><span class="amount rn" data-key="bd-bundle" data-pre="£" data-suf=".00" data-val="${bundleTotal}">£${bundleTotal}.00</span></div>
          <div class="bd-eye-date">Schedule after purchase</div>
          <ul class="bd-bundle-list">${names}</ul>
        </div>`);
    }
    (carry.addons || []).forEach(a => {
      const sub = (a.qty || 0) * (a.unit || 0);
      rows.push(`<div class="bd-priced"><div class="bd-row"><span class="name">${a.name} x ${a.qty}</span><span class="amount">£${sub}.00</span></div></div>`);
    });
    el.innerHTML = rows.join('');
  }

  function renderFooter() {
    const hasSecondaries = added.size > 0;
    const saved = savedAmount();

    document.getElementById('footer-contents').textContent = bundleContentsText();
    document.getElementById('footer-ticket-count').textContent = 'x ' + ticketCount + ' tickets';
    document.getElementById('footer-thumb').innerHTML = renderThumbCollage();

    // Discount callout — three "signatures":
    //   pct  (0 added)      → big "-78%" + "Pick one to increase the discount"
    //   keep (1..max-1)     → "Keep adding to unlock bigger discounts" + "SAVED £X"
    //   max  (max added)    → "Biggest discount unlocked" + "SAVED £X"
    // The banner ROLLS (roulette) only when the signature changes (pct↔keep at 0↔1, keep↔max
    // at the cap). Within the "keep" range the SAVED number just counts up (rn), like the CTA.
    const badge = document.getElementById('discount-badge');
    let inner;
    if (!hasSecondaries) {
      inner =
        `<div class="pct">-${discountPct()}%</div>
         <div class="copy"><div class="l1">On all attractions</div><div class="l2">Pick one to increase the discount</div></div>`;
    } else {
      const copy = added.size >= MAX_SECONDARIES
        ? 'Biggest discount unlocked'
        : 'Keep adding to unlock bigger discounts';
      inner =
        `<div class="copy grow"><div class="l1">${copy}</div></div>
         <div class="saved"><div class="saved-lbl">SAVED</div><div class="saved-amt"><span class="cur">£</span><span class="val rn" data-key="saved" data-pre="" data-suf="" data-val="${saved}">${saved}</span></div></div>`;
    }
    badge.innerHTML = `<div class="badge-inner">${inner}</div>`;

    // Step 2 CTA is always "TO PAYMENT".
    document.getElementById('continue-btn-text').innerHTML =
      `To payment - <span class="rn" data-key="cta" data-pre="£" data-suf=".00" data-val="${totalPrice()}">£${totalPrice()}.00</span>`;

    renderBreakdown();
  }

  // ===== Rolling-number animation =====
  // Each animatable figure is rendered as <span class="rn" data-key data-pre data-suf data-val>.
  // After every render we compare each key's new value to the value last shown and count up/down.
  const lastNums = {};
  function animateRolls() {
    document.querySelectorAll('.rn').forEach(el => {
      const key = el.dataset.key;
      const to  = parseInt(el.dataset.val, 10);
      const pre = el.dataset.pre || '';
      const suf = el.dataset.suf || '';
      const from = (key in lastNums) ? lastNums[key] : to;
      lastNums[key] = to;
      if (from === to) { el.textContent = pre + to + suf; return; }
      // Paint the OLD value first so the count-up starts there with no flash of the target.
      el.textContent = pre + from + suf;
      tweenNumber(el, from, to, pre, suf);
    });
  }
  function tweenNumber(el, from, to, pre, suf) {
    const dur = 420, start = performance.now();
    let finished = false;
    const settle = () => { if (!finished) { finished = true; el.textContent = pre + to + suf; } };
    function frame(t) {
      if (finished) return;
      let p = Math.min(1, (t - start) / dur);
      if (p >= 1) { settle(); return; }
      p = 1 - Math.pow(1 - p, 3); // easeOutCubic
      el.textContent = pre + Math.round(from + (to - from) * p) + suf;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    // Safety net: guarantee the final value even if rAF is throttled (background tab / reduced motion).
    setTimeout(settle, dur + 80);
  }

  // ===== "Roulette" roll transition =====
  // Slides an element's old content up/out while the new content rolls in. Used for the
  // footer plan-image collage and for a card's bottom strip when it switches state
  // (price → "Added!" and back).
  function kindOf(html) {
    if (/added-label/.test(html)) return 'added';
    if (/limit-label/.test(html)) return 'limit';
    return 'price';
  }
  function rollElement(el, oldHTML, newHTML, levelUp) {
    if (oldHTML === newHTML) return;
    const h = el.getBoundingClientRect().height;
    if (!h) return; // not laid out — leave the freshly-rendered new content in place
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    // Hide the real (new) children while the overlay does the rolling.
    const kids = Array.from(el.children);
    kids.forEach(k => { k.dataset._vis = k.style.visibility; k.style.visibility = 'hidden'; });

    const topHTML = levelUp ? oldHTML : newHTML;
    const botHTML = levelUp ? newHTML : oldHTML;
    const fromY = levelUp ? 0 : -h;
    const toY   = levelUp ? -h : 0;

    const overlay = document.createElement('div');
    overlay.className = '__roll-overlay';
    overlay.style.cssText = 'position:absolute;inset:0;overflow:hidden;pointer-events:none;';
    overlay.innerHTML =
      `<div class="__roll-stack" style="will-change:transform;transform:translateY(${fromY}px);">` +
        `<div style="height:${h}px;">${topHTML}</div>` +
        `<div style="height:${h}px;">${botHTML}</div>` +
      `</div>`;
    el.appendChild(overlay);
    const stack = overlay.querySelector('.__roll-stack');
    void stack.offsetHeight; // force a frame so the transition has a "from"
    stack.style.transition = 'transform 450ms cubic-bezier(0.5, 0, 0.5, 1)';
    stack.style.transform = `translateY(${toY}px)`;

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      if (overlay.parentNode) overlay.remove();
      kids.forEach(k => { k.style.visibility = k.dataset._vis || ''; delete k.dataset._vis; });
    };
    stack.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 650); // safety net if transitionend never fires
  }

  function captureSnapshot() {
    const strips = {};
    document.querySelectorAll('.card').forEach(c => {
      const sa = c.querySelector('.card-strip-area');
      if (sa) strips[c.dataset.id] = sa.innerHTML;
    });
    const thumbEl = document.getElementById('footer-thumb');
    const badgeEl = document.getElementById('discount-badge');
    const copyEl = badgeEl ? badgeEl.querySelector('.copy.grow') : null;
    return {
      strips, thumb: thumbEl ? thumbEl.innerHTML : '',
      badge: badgeEl ? badgeEl.innerHTML : '',
      layout: added.size === 0 ? 'pct' : 'saved',   // the callout's LAYOUT (pct number vs saved cluster)
      copy: copyEl ? copyEl.innerHTML : '',          // just the left "Keep adding…"/"Biggest…" text
      size: added.size,
    };
  }

  function applyRolls(prev) {
    const grew = added.size > prev.size; // add → content enters from below; remove → from above

    // Plan-image collage in the footer.
    const thumbEl = document.getElementById('footer-thumb');
    if (thumbEl && prev.thumb && thumbEl.innerHTML !== prev.thumb) {
      rollElement(thumbEl, prev.thumb, thumbEl.innerHTML, grew);
    }

    // Discount callout:
    //   • pct ↔ saved layout change (0↔1) → roll the WHOLE callout.
    //   • within the saved layout → the SAVED number just counts up (animateRolls, stays in
    //     place); if the left copy changed (keep↔max at the cap) roll ONLY that text.
    const badgeEl = document.getElementById('discount-badge');
    const layout = added.size === 0 ? 'pct' : 'saved';
    if (badgeEl && prev.badge && layout !== prev.layout) {
      rollElement(badgeEl, prev.badge, badgeEl.innerHTML, grew);
    } else if (layout === 'saved') {
      const copyEl = badgeEl && badgeEl.querySelector('.copy.grow');
      if (copyEl && prev.copy && copyEl.innerHTML !== prev.copy) {
        rollElement(copyEl, prev.copy, copyEl.innerHTML, grew);
      }
    }

    // Card strips — only roll when the strip's STATE changes (price ↔ added ↔ limit);
    // plain price-value changes are handled by the number count-up instead.
    document.querySelectorAll('.card').forEach(c => {
      const id = c.dataset.id;
      const sa = c.querySelector('.card-strip-area');
      const oldHTML = prev.strips[id];
      if (!sa || oldHTML == null) return;
      if (kindOf(oldHTML) !== kindOf(sa.innerHTML)) {
        rollElement(sa, oldHTML, sa.innerHTML, grew);
      }
    });
  }

  function fullRender(prev) {
    refreshCards();
    renderFooter();
    animateRolls();
    if (prev) applyRolls(prev);
  }

  // ===== Drawer expand / collapse =====
  // Always expandable — the breakdown shows the Tickets recap + London Eye even at 0 added.
  function toggleExpand() {
    document.getElementById('footer').classList.toggle('is-expanded');
  }
  document.getElementById('footer-grabber').addEventListener('click', toggleExpand);
  document.getElementById('footer-thumb').addEventListener('click', toggleExpand);

  // ===== Add / remove =====
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t || t.classList.contains('disabled')) return;
    const id = t.dataset.id;
    const prev = captureSnapshot(); // snapshot the pre-change DOM for the roll transition
    if (t.dataset.action === 'add') {
      if (added.has(id) || added.size >= MAX_SECONDARIES) return;
      added.add(id);
    } else if (t.dataset.action === 'remove') {
      added.delete(id);
    }
    persistAttractions();
    fullRender(prev);
  });

  // Remember the chosen attractions so they survive leaving/returning to this page
  // (e.g. back to the add-ons step and forward again).
  function persistAttractions() {
    try { localStorage.setItem('feverBundleAttractions', JSON.stringify(Array.from(added))); } catch (e) {}
  }

  // ===== Checkout hand-off — payload shape understood by checkout.html =====
  function goToCheckout() {
    try {
      const n = added.size;
      const payload = {
        londonEye: londonEyeBase,
        adultCount: ticketCount, childCount: 0,
        // Each secondary is billed as a single flat group line (adultUnit=bundled price, count=1),
        // so checkout's adult-line aggregation lands on the same total shown here.
        secondaries: addedInOrder().map(a => {
          const price = bundledPrice(a, n);
          return {
            id: a.id, name: a.name,
            adultUnit: price, childUnit: 0,
            adultCount: 1, childCount: 0,
            totalPaid: price, totalAnchor: anchorPrice(a), anchor: anchorPrice(a),
          };
        }),
        // Give checkout a single clean London-Eye ticket line that sums to londonEyeBase,
        // unless the schedule page already provided real ticket lines.
        schedule: {
          tickets: (carry.tickets && carry.tickets.length)
            ? carry.tickets
            : [{ name: 'Adult (16+)', qty: ticketCount, price: +(londonEyeBase / ticketCount).toFixed(2) }],
          addons: carry.addons || [],
          date: carry.date || 'Friday, 7 Feb',
          time: carry.timeslot || '06:00 PM',
        },
        total: totalPrice(),
      };
      localStorage.setItem('feverCheckout', JSON.stringify(payload));
    } catch (e) { /* localStorage blocked */ }
    nav('checkout.html');
  }

  // Navigate with a cache-buster so in-app transitions never serve a stale cached page.
  function nav(url) { window.location.href = (location.protocol === 'file:') ? url : url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now(); }

  // ===== INIT =====
  // Restore any previously-chosen attractions (e.g. after going back to add-ons and returning).
  try {
    const savedIds = JSON.parse(localStorage.getItem('feverBundleAttractions') || '[]');
    savedIds.forEach(id => { if (added.size < MAX_SECONDARIES && ATTRACTIONS.some(a => a.id === id)) added.add(id); });
  } catch (e) {}
  buildCards();   // create the persistent card elements once
  fullRender();   // paint initial footer + states (no animation on first paint)
</script>
</body>
</html>
