<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fever — Add more to your visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --eye-text-black: #1A1A1A;
    --eye-text-secondary: #8C8C8C;
    --eye-neutral-400: #7D8E98;
    --eye-text-dark: #031419;
    --eye-background-white: #FFFFFF;
    --eye-background-gray: #E8E8E8;
    --eye-background-gray-light: #F4F4F4;
    --eye-action-primary: #3A6FA0;
    --eye-action-gray: #CED3D9;
    --eye-action-gray-dark: #BCC1CA;
    --eye-action-secondary: #092241;
    --border-main: #CCD2D8;
    --danger: #EB0052;
    --page-bg: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Barlow', sans-serif; }
  html, body { margin: 0; padding: 0; background: #d8d8d8; -webkit-font-smoothing: antialiased; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px 0; }
  .device { width: 393px; height: 852px; background: var(--page-bg); position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08); }
  @media (max-width: 430px) { body { background:#fff; padding:0; align-items:stretch; } .device { width:100%; height:100dvh; border-radius:0; box-shadow:none; } }

  .ios-status { height: 58px; padding: 21px 16px 0; background: white; display: flex; align-items: center; justify-content: space-between; font-family: -apple-system, 'SF Pro', Inter, sans-serif; flex-shrink: 0; }
  .ios-status .time { font-size: 17px; font-weight: 590; }
  .ios-status .icons { display: flex; gap: 7px; align-items: center; font-size: 13px; }
  .merlin-banner { background: #092241; text-align: center; padding: 8px 0; flex-shrink: 0; }
  .merlin-banner img { height: 16px; display: inline-block; vertical-align: middle; }

  .sheet { background: white; box-shadow: 0 -6px 6px rgba(0,70,121,0.20); flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 7px; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .sheet-header .placeholder { width: 36px; height: 36px; }
  .sheet-header .title { flex: 1; text-align: center; color: #000; font-size: 18px; font-weight: 700; line-height: 18px; }
  .sheet-header .back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; border: 0; color: #000; padding: 0; }
  .sheet-header .back svg { width: 24px; height: 24px; }

  /* 2-step progress stepper */
  .stepper { display: flex; gap: 8px; padding: 0 16px 16px; }
  .stepper .seg { flex: 1 1 0; height: 4px; border-radius: 100px; background: var(--eye-background-gray); }
  .stepper .seg.done { background: var(--eye-action-gray-dark); }

  .content { flex: 1; overflow-y: auto; padding: 0 16px 300px; scroll-behavior: smooth; }
  .content::-webkit-scrollbar { display: none; }
  .content { scrollbar-width: none; }
  .intro { color: var(--eye-text-black); font-size: 16px; font-weight: 400; line-height: 24px; padding: 16px 0; }

  /* Add-on card */
  .addon { padding: 12px; background: white; border-radius: 8px; outline: 1px solid var(--eye-background-gray); outline-offset: -1px; display: flex; flex-direction: column; gap: 24px; margin-bottom: 16px; transition: outline-color 200ms; }
  .addon.active { outline-color: var(--border-main); }
  .addon-top { display: flex; align-items: flex-start; gap: 16px; }
  .addon-text { flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .addon-name { color: var(--eye-text-dark); font-size: 20px; font-weight: 500; line-height: 24px; }
  .addon-desc { color: var(--eye-action-secondary); font-size: 16px; font-weight: 400; line-height: 24px; }
  .addon-thumb { width: 108px; height: 108px; border-radius: 8px; flex-shrink: 0; object-fit: cover; background: var(--eye-background-gray-light); }
  .addon-bottom { display: flex; align-items: center; gap: 16px; }
  .addon-price-wrap { flex: 1 1 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .addon-price { color: var(--eye-text-dark); font-size: 16px; line-height: 24px; }
  .addon-price .lead { font-weight: 400; }
  .addon-price s { font-weight: 400; color: var(--eye-text-dark); }
  .addon-price strong { font-weight: 700; }
  .off-badge { height: 20px; min-width: 48px; padding: 2px 6px; background: var(--danger); border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; color: #fff; font-size: 12px; line-height: 16px; }
  .off-badge svg { width: 12px; height: 12px; }

  /* Quantity stepper control */
  .qty { width: 112px; background: var(--eye-background-gray-light); border-radius: 32px; display: flex; align-items: center; justify-content: center; padding: 4px; gap: 0; }
  .qty-btn { width: 32px; height: 32px; border-radius: 64px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 150ms; padding: 0; }
  .qty-btn svg { width: 13px; height: 13px; display: block; }
  .qty-minus { background: var(--eye-background-gray); }
  .qty-minus svg path { fill: var(--eye-action-gray-dark); }
  .qty-minus.enabled { background: var(--eye-action-secondary); cursor: pointer; }
  .qty-minus.enabled svg path { fill: #fff; }
  .qty-plus { background: var(--eye-action-secondary); }
  .qty-plus svg path { fill: #fff; }
  .qty-plus.disabled { background: var(--eye-background-gray); cursor: not-allowed; }
  .qty-plus.disabled svg path { fill: var(--eye-action-gray-dark); }
  .qty-num { flex: 1 1 0; text-align: center; color: var(--eye-text-black); font-size: 16px; line-height: 24px; padding: 0 4px; }
  .qty-btn:not(.disabled):active { transform: scale(0.9); }

  /* ===== Footer (bottom sheet, expandable) ===== */
  .footer { position: absolute; bottom: 0; left: 0; right: 0; background: white; box-shadow: 0 -6px 6px rgba(0,70,121,0.20); padding: 16px; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
  .footer-grabber { width: 70px; height: 4px; background: #DDDDDD; border-radius: 100px; margin: 0 auto; cursor: pointer; }
  .footer-top { display: flex; align-items: center; gap: 16px; }
  .footer-thumb { width: 84px; height: 84px; border-radius: 8px; flex-shrink: 0; overflow: hidden; background: #ECE3D3; }
  .footer-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Collage of London Eye + selected attractions (same as the upsell step). */
  .thumb-collage { width: 100%; height: 100%; display: grid; position: relative; }
  .thumb-collage > img { width: 100%; height: 100%; object-fit: cover; display: block; min-width: 0; min-height: 0; }
  .thumb-collage-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .thumb-collage-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-3 > img:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  .thumb-collage-3 > img:nth-child(2) { grid-column: 1; grid-row: 2; }
  .thumb-collage-3 > img:nth-child(3) { grid-column: 2; grid-row: 2; }
  .thumb-collage-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .thumb-collage-5 > img:nth-child(5) { position: absolute; width: 50%; height: 50%; top: 25%; left: 25%; border-radius: 50%; }
  .thumb-collage > img[data-id="tussauds"] { object-position: center top; }
  .footer-summary-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .footer-pretitle { color: var(--eye-text-secondary); font-size: 16px; font-weight: 500; line-height: 1.2; }
  .footer-contents { color: var(--eye-text-black); font-size: 20px; font-weight: 600; line-height: 1.2; }
  .footer-ticket-count { display: flex; align-items: center; gap: 4px; color: var(--eye-text-secondary); font-size: 20px; line-height: 1.2; margin-top: 2px; }

  .footer-breakdown { max-height: 0; overflow: hidden; margin-top: -16px; transition: max-height 420ms cubic-bezier(0.4,0,0.2,1), margin-top 420ms cubic-bezier(0.4,0,0.2,1); }
  .footer.is-expanded .footer-breakdown { max-height: 480px; margin-top: 0; }
  .bd-divider { height: 1px; background: var(--eye-background-gray); margin: 0 0 16px; }
  .bd-section-title { font-size: 16px; font-weight: 600; color: var(--eye-text-black); margin-bottom: 4px; }
  .bd-ticket-line { font-size: 14px; font-weight: 600; color: var(--eye-neutral-400); line-height: 20px; }
  .bd-tickets { margin-bottom: 16px; }
  .bd-priced + .bd-priced { margin-top: 16px; }
  .bd-row { display: flex; justify-content: space-between; align-items: baseline; }
  .bd-row .name, .bd-row .amount { font-size: 16px; font-weight: 600; color: var(--eye-text-black); }
  .bd-eye-date { font-size: 14px; font-style: italic; color: var(--eye-neutral-400); margin-top: 2px; }
  .bd-bundle-list { margin: 4px 0 0; padding-left: 18px; }
  .bd-bundle-list li { color: var(--eye-neutral-400); font-size: 14px; line-height: 20px; }
  /* Cluster Bundle: sections (price row, London Eye visit, scheduled-after) are 8px apart;
     the italic lead + bold names WITHIN each section stay tight. No bullets. */
  .bd-bundle-block { display: flex; flex-direction: column; gap: 8px; }
  .bd-bundle-lead { font-size: 14px; font-style: italic; color: var(--eye-neutral-400); line-height: 20px; }
  .bd-bundle-names { font-size: 14px; font-weight: 600; color: var(--eye-neutral-400); line-height: 20px; }
  /* "You are choosing add-ons for… / London Eye" banner at the top of the page. */
  .addon-banner { display: flex; align-items: center; gap: 8px; background: #E7F1FA; border-radius: 8px; padding: 8px; margin: 16px 0 0; }
  .addon-banner img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .addon-banner .ab-sub { color: var(--eye-action-secondary); font-size: 14px; font-weight: 500; }
  .addon-banner .ab-main { color: var(--eye-text-dark); font-size: 18px; font-weight: 400; line-height: 24px; }

  .continue-btn { width: 100%; height: 48px; background: var(--eye-action-primary); color: white; font-size: 20px; font-weight: 400; border: 0; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; }
  .continue-btn:active { opacity: 0.85; }

  .rn { display: inline-block; }
</style>
</head>

<div class="device">

  <a class="merlin-banner" href="index.html" aria-label="Back to London Eye home" style="text-decoration:none; display:block;"><img src="Merlin.png" alt="Merlin"/></a>

      <button class="continue-btn" onclick="goToUpsell()"><span id="continue-btn-text">CONTINUE - £126.00</span></button>
    </div>
  </div>
</div>

  // ===== Carry from the schedule page (tickets + date). Falls back to £126 / 5 tickets. =====
  const LONDON_EYE_PRICE = 126;
  // Demo default (used when opened standalone) mirrors a 2 adult + 2 child + 1 under-2 selection.
  const DEFAULT_TICKETS = [
    { name: 'Adult (16+)', qty: 2, price: 63 },
    { name: 'Child (2 - 15 Years)', qty: 2, price: 0 },
    { name: 'Under 2', qty: 1, price: 0 },
  ];
  // Present-day default so the prototype is never stuck on a fixed date.
  const _t = new Date();
  const TODAY = `${_t.toLocaleDateString('en-GB', { weekday: 'long' })}, ${_t.getDate()} ${_t.toLocaleDateString('en-GB', { month: 'short' })}`;
  let carry = { tickets: DEFAULT_TICKETS, date: TODAY, timeslot: '10:00 AM', total: LONDON_EYE_PRICE, ticketCount: 5 };
  try {
    const raw = localStorage.getItem('feverScheduleCarry');
    if (raw) {
      const c = JSON.parse(raw);
      const tCount = (c.tickets || []).reduce((s, t) => s + (t.qty || 0), 0);
      carry = {
        tickets: (c.tickets && c.tickets.length) ? c.tickets : DEFAULT_TICKETS,
        addons: c.addons || [],
        date: c.date || TODAY,
        timeslot: c.timeslot || '10:00 AM',
        total: (c.tickets || []).reduce((s, t) => s + (t.qty || 0) * (t.price || 0), 0) || LONDON_EYE_PRICE,
        ticketCount: tCount || 5,
      };
    }
  } catch (e) { /* localStorage blocked */ }

  let londonEyeBase = carry.total; // cluster mode overrides this with the full bundle total below
  const ticketCount = carry.ticketCount;
  const MAX_PER = Math.max(1, ticketCount); // up to one add-on per ticket

  // ===== Secondary attractions carried back from the upsell page (same pricing model) =====
  // If the user picked attractions on the "Add now and save" step and comes back here, we
  // show them (as a Bundle line) and include their price in the total.
  const STD_BUNDLED = { 1: 33, 2: 28, 3: 24, 4: 21 };
  const BUS_BUNDLED = { 1: 43, 2: 38, 3: 34, 4: 31 };
  const ATTRACTIONS = [
    { id: 'tussauds', name: 'Madame Tussauds',    bundled: STD_BUNDLED, image: 'Madame Tussauds.png' },

  // Cluster flow (came from the picker): attractions come from feverPickerSelection and their

  // Standard flow: attractions come back from the cross-sell (feverBundleAttractions), priced.
  let attractions = [], clusterMode = false;
  try {
    const picker = JSON.parse(localStorage.getItem('feverPickerSelection') || 'null');
    if (picker && picker.mode === 'multi' && Array.isArray(picker.attractions)) {
      clusterMode = true;
      attractions = picker.attractions.filter(id => id !== 'londoneye').map(id => ATTRACTIONS.find(a => a.id === id)).filter(Boolean);
    } else {
      const ids = JSON.parse(localStorage.getItem('feverBundleAttractions') || '[]');
      attractions = ids.map(id => ATTRACTIONS.find(a => a.id === id)).filter(Boolean);
    }
  } catch (e) {}
  // In the cluster flow the full bundle total (London Eye + secondaries) was already computed on
  // the plan view and stored in feverCheckout — use it as the base so we don't recompute prices.
  if (clusterMode) {
    try {
      const co = JSON.parse(localStorage.getItem('feverCheckout') || 'null');
      // Prefer the add-on-free bundleBase so re-entry (back from checkout) doesn't inflate it.
      if (co && typeof co.bundleBase === 'number') londonEyeBase = co.bundleBase;
      else if (co && typeof co.total === 'number') londonEyeBase = co.total;
    } catch (e) {}
  }
  const attractionsTotal = () => {
    if (clusterMode) return 0; // bundle price already in the ticket total
    const n = attractions.length; if (!n) return 0;
    const clamp = Math.max(1, Math.min(4, n));
    return attractions.reduce((s, a) => s + a.bundled[clamp], 0);
  };

  // ===== State =====
  const qty = { river: 0, bino: 0, champ: 0, photo: 0 };
  // Restore add-ons the user already picked (so returning here keeps the same selection/price).
  (carry.addons || []).forEach(a => { if (a && a.id in qty) qty[a.id] = a.qty || 0; });
  const addonById = id => ADDONS.find(a => a.id === id);
  const addonsTotal = () => ADDONS.reduce((s, a) => s + qty[a.id] * a.price, 0);
  const grandTotal = () => londonEyeBase + attractionsTotal() + addonsTotal();

  // ===== Render =====
  function priceHTML(a) {
    if (a.off) {
      return `<span class="off-badge">${OFF_ICON}${a.off}% off</span>
              <div class="addon-price"><span class="lead">Add for </span><s>£${a.was}.00</s> <strong>£${a.price}.00</strong></div>`;
    }
    return `<div class="addon-price"><strong>£${a.price}.00</strong></div>`;
  }

  function buildAddons() {
    const list = document.getElementById('addons-list');
    list.innerHTML = '';
    ADDONS.forEach(a => {
      const card = document.createElement('div');
      card.className = 'addon';
      card.dataset.id = a.id;
      card.innerHTML = `
        <div class="addon-top">
          <div class="addon-text">
            <div class="addon-name">${a.name}</div>
            <div class="addon-desc">${a.desc}</div>
          </div>
          <img class="addon-thumb" src="${a.image}" alt="" />
        </div>
        <div class="addon-bottom">
          <div class="addon-price-wrap">${priceHTML(a)}</div>
          <div class="qty">
            <button class="qty-btn qty-minus" data-act="dec" data-id="${a.id}" aria-label="Remove one">${MINUS_SVG}</button>
            <span class="qty-num" id="qty-${a.id}">0</span>
            <button class="qty-btn qty-plus" data-act="inc" data-id="${a.id}" aria-label="Add one">${PLUS_SVG}</button>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  function refreshCard(id) {
    const n = qty[id];
    document.getElementById('qty-' + id).textContent = n;
    const card = document.querySelector('.addon[data-id="' + id + '"]');
    card.classList.toggle('active', n > 0);
    card.querySelector('.qty-minus').classList.toggle('enabled', n > 0);
    card.querySelector('.qty-plus').classList.toggle('disabled', n >= MAX_PER);
  }

  function renderBreakdown() {
    const rows = [];
    if (clusterMode) {
      // Cluster: Tickets recap, then a single "Bundle" line (the whole bundle price) broken down
      // into the London Eye visit (with its date) and the secondaries scheduled after purchase.
      const ticketLines = (carry.tickets || [])
        .filter(t => (t.qty || 0) > 0)
        .map(t => `<div class="bd-ticket-line">${t.name} x ${t.qty}</div>`).join('');
      const schedBlock = attractions.length
        ? `<div>
             <div class="bd-bundle-lead">Schedule after purchase</div>
             <div class="bd-bundle-names">${attractions.map(a => a.name).join('<br/>')}</div>
           </div>`
        : '';
      rows.push(`<div class="bd-divider"></div>`);
      rows.push(`<div class="bd-tickets"><div class="bd-section-title">Tickets</div>${ticketLines}</div>`);
      rows.push(`<div class="bd-divider"></div>`);
      rows.push(`<div class="bd-priced bd-bundle-block">
          <div class="bd-row"><span class="name">Bundle</span><span class="amount">£${londonEyeBase}.00</span></div>
          <div>
            <div class="bd-bundle-lead">${carry.date} - ${carry.timeslot}</div>
            <div class="bd-bundle-names">London Eye</div>
          </div>
          ${schedBlock}
        </div>`);
    } else {
      // Standard: Tickets recap + London Eye plan line, plus any Bundle carried back from the upsell.
      const ticketLines = (carry.tickets || [])
        .filter(t => (t.qty || 0) > 0)
        .map(t => `<div class="bd-ticket-line">${t.name} x ${t.qty}</div>`).join('');
      rows.push(`<div class="bd-divider"></div>`);
      rows.push(`<div class="bd-tickets"><div class="bd-section-title">Tickets</div>${ticketLines}</div>`);
      rows.push(`<div class="bd-divider"></div>`);
      rows.push(`<div class="bd-priced">
          <div class="bd-row"><span class="name">London Eye</span><span class="amount">£${londonEyeBase}.00</span></div>
          <div class="bd-eye-date">${carry.date} - ${carry.timeslot}</div>
        </div>`);
      if (attractions.length) {
        const names = attractions.map(a => `<li>${a.name}</li>`).join('');
        rows.push(`<div class="bd-priced">
            <div class="bd-row"><span class="name">Bundle</span><span class="amount">£${attractionsTotal()}.00</span></div>
            <div class="bd-eye-date">Schedule after purchase</div>
            <ul class="bd-bundle-list">${names}</ul>
          </div>`);
      }
    }
    ADDONS.filter(a => qty[a.id] > 0).forEach(a => {
      rows.push(`<div class="bd-priced"><div class="bd-row"><span class="name">${a.name} x ${qty[a.id]}</span><span class="amount">£${qty[a.id] * a.price}.00</span></div></div>`);
    });
    document.getElementById('footer-breakdown').innerHTML = rows.join('');
  }

  function renderFooter() {
    if (clusterMode) {
      // Cluster: the header reflects the primary product (London Eye ticket); the bundle breakdown
      // below lists the scheduled-after attractions. Single London Eye thumbnail.
      document.querySelector('.footer-contents').textContent = 'London Eye - Standard ticket';
      document.getElementById('footer-thumb').innerHTML = '<img src="London Eye.jpg" alt="London Eye"/>';
    } else {
      document.querySelector('.footer-contents').textContent = attractions.length
        ? `London Eye + ${attractions.length} attraction${attractions.length > 1 ? 's' : ''}`
        : 'London Eye - Standard ticket';
      // Thumbnail collage: London Eye + selected attractions (matches the upsell step).
      const cells = ['<img src="London Eye.jpg" alt="London Eye" data-id="eye" />']
        .concat(attractions.map(a => `<img src="${a.image}" alt="${a.name}" data-id="${a.id}" />`));
      document.getElementById('footer-thumb').innerHTML = `<div class="thumb-collage thumb-collage-${cells.length}">${cells.join('')}</div>`;
    }
    document.getElementById('footer-ticket-count').textContent = 'x ' + ticketCount + ' tickets';
    document.getElementById('continue-btn-text').innerHTML =
      `CONTINUE - <span class="rn" data-key="cta" data-pre="£" data-suf=".00" data-val="${grandTotal()}">£${grandTotal()}.00</span>`;
    renderBreakdown();
  }

  // ===== Count-up number animation (shared pattern with the upsell page) =====
  const lastNums = {};
  function animateRolls() {
    document.querySelectorAll('.rn').forEach(el => {
      const key = el.dataset.key, to = parseInt(el.dataset.val, 10);
      const pre = el.dataset.pre || '', suf = el.dataset.suf || '';
      const from = (key in lastNums) ? lastNums[key] : to;
      lastNums[key] = to;
      if (from === to) { el.textContent = pre + to + suf; return; }
      el.textContent = pre + from + suf;
      tweenNumber(el, from, to, pre, suf);
    });
  }
  function tweenNumber(el, from, to, pre, suf) {
    const dur = 420, start = performance.now();
    let finished = false;
    const settle = () => { if (!finished) { finished = true; el.textContent = pre + to + suf; } };
    function frame(t) {
      if (finished) return;
      let p = Math.min(1, (t - start) / dur);
      if (p >= 1) { settle(); return; }
      p = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + Math.round(from + (to - from) * p) + suf;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    setTimeout(settle, dur + 80);
  }

  function fullRender() { renderFooter(); animateRolls(); }

  // ===== Events =====
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn || btn.classList.contains('disabled')) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === 'inc') { if (qty[id] >= MAX_PER) return; qty[id]++; }
    else { if (qty[id] <= 0) return; qty[id]--; }
    refreshCard(id);
    fullRender();
  });

  function toggleExpand() { document.getElementById('footer').classList.toggle('is-expanded'); }
  document.getElementById('footer-grabber').addEventListener('click', toggleExpand);
  document.querySelector('.footer-top').addEventListener('click', toggleExpand);

  // ===== Continue =====
  // Standard flow → attractions upsell (cross-sell). Cluster flow (came from the picker/plan
  // view) → straight to checkout, with the chosen add-ons folded into the existing payload.
  function goToUpsell() {
    const chosenAddons = ADDONS.filter(a => qty[a.id] > 0).map(a => ({ id: a.id, name: a.name, qty: qty[a.id], unit: a.price }));
    let isMulti = false;
    try {
      const picker = JSON.parse(localStorage.getItem('feverPickerSelection') || 'null');
      isMulti = !!(picker && picker.mode === 'multi');
    } catch (e) {}

    try {
      const payload = {
        tickets: (carry.tickets && carry.tickets.length)
          ? carry.tickets
          : [{ name: 'Adult (16+)', qty: ticketCount, price: +(londonEyeBase / ticketCount).toFixed(2) }],
        addons: chosenAddons,
        date: carry.date,
        timeslot: carry.timeslot,
        total: londonEyeBase,
      };
      localStorage.setItem('feverScheduleCarry', JSON.stringify(payload));
    } catch (e) { /* localStorage blocked */ }

    if (isMulti) {
      // Fold the add-ons into the multi checkout payload written by the plan view.
      try {
        const co = JSON.parse(localStorage.getItem('feverCheckout') || 'null');
        if (co) {
          co.schedule = co.schedule || {};
          co.schedule.addons = chosenAddons;
          // Recompute from the stable base so re-continuing doesn't stack add-ons.
          const base = (typeof co.bundleBase === 'number') ? co.bundleBase : (co.total || 0);
          co.total = base + addonsTotal();
          localStorage.setItem('feverCheckout', JSON.stringify(co));
        }
      } catch (e) {}
      nav('checkout.html');
      return;
    }
    nav('fever-bundle-prototype_1.html');
  }

  // Navigate with a cache-buster so in-app transitions never serve a stale cached page.
  function nav(url) { window.location.href = (location.protocol === 'file:') ? url : url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now(); }

  // ===== Init =====
  // The "You are choosing add-ons for… London Eye" banner shows only in the CLUSTER flow; in the
  // standard flow it's hidden. The 2-step progress stepper is hidden in the cluster flow (which
  // goes add-ons → checkout directly, with no step 2).
  if (clusterMode) {
    const st = document.getElementById('stepper'); if (st) st.style.display = 'none';
  } else {
    const banner = document.querySelector('.addon-banner'); if (banner) banner.style.display = 'none';
  }
  buildAddons();
  ADDONS.forEach(a => refreshCard(a.id));
  fullRender();
</script>
</body>
