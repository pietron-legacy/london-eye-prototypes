<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fever — Add now and save</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/flubber@0.4.2/build/flubber.min.js"></script>
<style>
  :root {
    --eye-text-black: #1A1A1A;
    --eye-text-secondary: #8C8C8C;
    --eye-background-white: #FFFFFF;
    --eye-background-gray: #E8E8E8;
    --eye-action-primary: #518EC8;
    --eye-action-gray: #CED3D9;
    --eye-action-selected: #D3E3F1;
    --eye-action-selection: rgba(81, 142, 200, 0.40);
    --palette-neutral-700: #06232C;
    --palette-neutral-white: #FFFFFF;
    --page-bg: #F7E9C7;

    --tussauds: #6A0407;
    --sealife: #1D1F6B;
    --shreks: #215732;
    --dungeon: #222222;
    --bigbus: #7E6941;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Barlow', sans-serif; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px 0;
  }

  .device {
    width: 393px;
    height: 852px;
    background: var(--page-bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.08);
  }

  .sheet {
    background: white;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    box-shadow: 0 -6px 6px rgba(0, 70, 121, 0.20);
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: 7px;
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 8px 0 8px;
  }
  .sheet-header .placeholder { width: 44px; height: 44px; opacity: 0; }
  .sheet-header .title {
    flex: 1;
    text-align: center;
    color: var(--eye-text-black);
    font-size: 20px;
    font-weight: 500;
  }
  .sheet-header .close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: 0;
    color: var(--palette-neutral-700);
  }
  .sheet-header .close svg { width: 22px; height: 22px; }

  .header-divider {
    margin: 16px 16px 0 16px;
    height: 1px;
    background: var(--eye-background-gray);
  }

  .cards-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 300px 16px;
    scroll-behavior: smooth;
  }
  .cards-scroll::-webkit-scrollbar { display: none; }
  .cards-scroll { scrollbar-width: none; }

  .card {
    position: relative;
    border-radius: 16px;
    border: 1px solid var(--eye-action-gray);
    overflow: hidden;
    margin-bottom: 16px;
    background: white;
  }
  .card:last-child { margin-bottom: 0; }

  .card-visual {
    position: relative;
    height: 120px;
    overflow: hidden;
  }
  /* Image at natural aspect ratio, height matches card, sitting on the right */
  .card-visual img {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: auto;
    display: block;
  }
  /* Gradient overlay sits on top of the image, fading from solid colour on left to transparent on right */
  .card-visual .gradient {
    position: absolute;
    inset: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    z-index: 1;
  }
  .card-visual .gradient h3 {
    margin: 0;
    color: white;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.2px;
    width: 65%;
  }
  .card-visual .gradient p {
    margin: 0;
    color: white;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.25;
    width: 60%;
  }

  /* Card-visual base background = solid brand colour, in case the image doesn't extend to all edges */
  .card[data-id="tussauds"] .card-visual { background: #6A0407; }
  .card[data-id="sealife"]  .card-visual { background: #1D1F6B; }
  .card[data-id="shreks"]   .card-visual { background: #215732; }
  .card[data-id="dungeon"]  .card-visual { background: #1A1A1A; }
  .card[data-id="bigbus"]   .card-visual { background: #7E6941; }

  /* Brand-coloured gradients per attraction: matches reference — solid colour until 68%, fading to transparent at 100% */
  .card[data-id="tussauds"] .gradient { background: linear-gradient(90deg, #6A0407 68%, rgba(106, 4, 7, 0) 100%); }
  .card[data-id="sealife"]  .gradient { background: linear-gradient(90deg, #1D1F6B 68%, rgba(29, 31, 107, 0) 100%); }
  .card[data-id="shreks"]   .gradient { background: linear-gradient(90deg, #215732 68%, rgba(33, 87, 50, 0) 100%); }
  .card[data-id="dungeon"]  .gradient { background: linear-gradient(90deg, #1A1A1A 68%, rgba(26, 26, 26, 0) 100%); }
  .card[data-id="bigbus"]   .gradient { background: linear-gradient(90deg, #7E6941 68%, rgba(126, 105, 65, 0) 100%); }

  /* Card price strip */
  .card-strip-area {
    position: relative;
    min-height: 60px;
    background: white;
  }
  .card-strip-area > .card-strip,
  .card-strip-area > .added-strip,
  .card-strip-area > .limit-strip {
    min-height: 60px;
    box-sizing: border-box;
  }
  .card-strip {
    background: white;
    padding: 12px 12px 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .price-info {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .ticket-icon {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--eye-text-secondary);
    font-size: 14px;
  }
  .ticket-icon svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .anchor-price {
    color: var(--eye-text-secondary);
    font-size: 14px;
    text-decoration: line-through;
    font-family: 'Barlow', sans-serif;
  }
  .current-price {
    color: var(--eye-text-black);
    font-size: 16px;
    font-weight: 600;
    line-height: 20px;
    transition: transform 200ms ease-out;
    display: inline-block;
    font-family: 'Barlow', sans-serif;
  }
  .current-price.pulsing {
    animation: price-pulse 500ms ease-out;
  }
  @keyframes price-pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .save-label {
    color: var(--eye-text-black);
    font-size: 14px;
    font-style: italic;
    font-weight: 300;
    font-family: 'Barlow', sans-serif;
  }

  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--eye-action-primary);
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 150ms ease-out, background 150ms;
    flex-shrink: 0;
  }
  .add-btn:not(.disabled):active { transform: scale(0.9); }
  .add-btn svg { width: 18px; height: 18px; color: white; }
  .add-btn.disabled {
    background: var(--eye-action-gray);
    cursor: not-allowed;
    opacity: 0.7;
  }
  .add-btn.disabled svg { color: #FFF; opacity: 0.85; }

  /* Added state strip */
  .added-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px;
    background: white;
  }
  .added-label {
    color: var(--eye-text-black);
    font-size: 16px;
    font-weight: 600;
    font-family: 'Barlow', sans-serif;
  }
  .remove-btn {
    background: none;
    border: 0;
    color: var(--eye-action-primary);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 4px 8px;
    font-family: 'Barlow', sans-serif;
  }
  /* Bundle-limit-reached strip (same layout as added-strip, no button) */
  .limit-strip {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 16px 16px;
    background: white;
  }
  .limit-label {
    color: var(--eye-text-secondary);
    font-size: 16px;
    font-weight: 600;
    font-family: 'Barlow', sans-serif;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    box-shadow: 0 -4px 4px rgba(0, 0, 0, 0.05);
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }

  .footer-status {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .level-chip {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .level-chip.bouncing {
    animation: chip-bounce 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes chip-bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .level-chip svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .level-chip .level-text {
    position: relative;
    z-index: 1;
    pointer-events: none;
    text-align: center;
    color: #0F2F4E;
    line-height: 1;
    font-family: inherit;
  }
  .level-chip .level-text .num {
    display: block;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .level-chip .level-text .of {
    display: block;
    font-size: 10px;
    font-weight: 600;
    margin-top: 3px;
    letter-spacing: 0.2px;
    text-transform: lowercase;
  }

  .footer-subline {
    flex: 1;
    min-width: 0;            /* allow shrinking inside the flex row so the text can be elided */
    color: var(--eye-text-black);
    font-size: 15px;
    line-height: 1.3;
    font-weight: 400;
    font-family: 'Barlow', sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .footer-divider {
    height: 1px;
    background: var(--eye-background-gray);
  }

  .footer-summary {
    display: flex;
    align-items: stretch;
    gap: 12px;
  }
  .footer-thumb {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    flex-shrink: 0;
    overflow: hidden;
    background: #ECE3D3;
  }
  .footer-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Dynamic collage of the user's actual selected attractions.
     The London Eye is image #1; secondaries fill the rest in addition order. No gap between tiles. */
  .thumb-collage {
    width: 100%;
    height: 100%;
    display: grid;
    position: relative;
  }
  .thumb-collage > img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    min-width: 0;
    min-height: 0;
  }
  /* 1 image — Eye only, fills the thumb */
  .thumb-collage-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  /* 2 images — horizontal split: Eye on top, secondary on bottom */
  .thumb-collage-2 {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
  }
  /* 3 images — Eye spans top row, 2 secondaries on the bottom row */
  .thumb-collage-3 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .thumb-collage-3 > img:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  .thumb-collage-3 > img:nth-child(2) { grid-column: 1; grid-row: 2; }
  .thumb-collage-3 > img:nth-child(3) { grid-column: 2; grid-row: 2; }
  /* 4 images — 2x2 grid, Eye top-left, secondaries TR / BL / BR */
  .thumb-collage-4 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  /* 5 images — 2x2 grid of 4 images + the 5th (last-added secondary) as a circle overlay in the centre */
  .thumb-collage-5 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .thumb-collage-5 > img:nth-child(5) {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 25%;
    left: 25%;
    border-radius: 50%;
  }
  /* Madame Tussauds — heads are at the top of the image, keep them visible when the tile gets cropped */
  .thumb-collage > img[data-id="tussauds"] {
    object-position: center top;
  }
  .footer-summary-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .footer-contents {
    color: var(--eye-text-black);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    font-family: 'Barlow', sans-serif;
    /* Reserve space for two lines so the layout doesn't jump when the bundle title wraps. */
    min-height: calc(2 * 1.2 * 15px);
  }
  .footer-bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .footer-total {
    color: var(--eye-text-black);
    font-size: 16px;
    font-weight: 600;
    font-family: 'Barlow', sans-serif;
  }
  .footer-total .total-amount {
    transition: transform 200ms ease-out;
    display: inline-block;
  }
  .footer-total .total-amount.pulsing {
    animation: price-pulse 500ms ease-out;
  }

  .continue-btn {
    width: 100%;
    height: 48px;
    background: var(--eye-action-primary);
    color: white;
    font-size: 18px;
    font-weight: 500;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-family: 'Barlow', sans-serif;
  }
  .continue-btn:active { opacity: 0.85; }

  .strip-fade-enter {
    opacity: 0;
    transform: translateY(4px);
    animation: strip-fade-in 240ms ease-out forwards;
  }
  @keyframes strip-fade-in {
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>
<div class="device">
  <div class="sheet">
    <div class="sheet-header">
      <div class="placeholder"></div>
      <div class="title">Add now and save</div>
      <button class="close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="header-divider"></div>

    <div class="cards-scroll" id="cards-scroll">
      <!-- Cards injected by JS -->
    </div>

    <div class="footer">
      <div class="footer-status">
        <div class="level-chip" id="level-chip">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path id="level-shape-path" fill="#D3E3F1" stroke="#518EC8" stroke-opacity="0.4" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill" />
          </svg>
          <div class="level-text">
            <span class="num" id="level-num">1st</span>
            <span class="of">level of 5</span>
          </div>
        </div>
        <div class="footer-subline" id="footer-subline">
          Add an attraction to start saving.
        </div>
      </div>
      <div class="footer-divider"></div>
      <div class="footer-summary">
        <div class="footer-thumb" id="footer-thumb"></div>
        <div class="footer-summary-info">
          <div class="footer-contents" id="footer-contents">London Eye - Standard ticket</div>
          <div class="footer-bottom-row">
            <div class="ticket-icon" id="footer-ticket-icon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.625 7C4.625 6.53516 5.00781 6.125 5.5 6.125H12.5C12.9648 6.125 13.375 6.53516 13.375 7V10.5C13.375 10.9922 12.9648 11.375 12.5 11.375H5.5C5.00781 11.375 4.625 10.9922 4.625 10.5V7ZM5.5 10.5H12.5V7H5.5V10.5ZM16.875 5.25V7.4375C16.1367 7.4375 15.5625 8.03906 15.5625 8.75C15.5625 9.48828 16.1367 10.0625 16.875 10.0625V12.25C16.875 13.2344 16.082 14 15.125 14H2.875C1.89062 14 1.125 13.2344 1.125 12.25V10.0625C1.83594 10.0625 2.4375 9.48828 2.4375 8.75C2.4375 8.03906 1.83594 7.4375 1.125 7.4375V5.25C1.125 4.29297 1.89062 3.5 2.875 3.5H15.125C16.082 3.5 16.875 4.29297 16.875 5.25ZM2 6.75391C2.76562 7.08203 3.3125 7.875 3.3125 8.75C3.3125 9.65234 2.76562 10.418 2 10.7734V12.25C2 12.7422 2.38281 13.125 2.875 13.125H15.125C15.5898 13.125 16 12.7422 16 12.25V10.7734C15.207 10.418 14.6875 9.65234 14.6875 8.75C14.6875 7.875 15.207 7.08203 16 6.75391V5.25C16 4.78516 15.5898 4.375 15.125 4.375H2.875C2.38281 4.375 2 4.78516 2 5.25V6.75391Z" fill="#8C8C8C"/></svg>
              <span>x 5</span>
            </div>
            <div class="footer-total">
              Total <span class="total-amount" id="total-amount">£126.00</span>
            </div>
          </div>
        </div>
      </div>
      <button class="continue-btn">Continue to payment</button>
    </div>
  </div>
</div>

<script>
  // ===== DATA =====
  // For this prototype, the path is fixed: SEA Life -> Shrek's -> Big Bus -> Madame Tussauds
  // The London Dungeon is never added, but appears as a card. Once 4 are added (level 5),
  // its button is disabled.
  // Cards are displayed in this order in the UI:
  const ATTRACTIONS = [
    {
      id: 'tussauds',
      name: 'Madame Tussauds',
      description: 'Step into immersive sets and come face-to-face with incredibly lifelike celebrities.',

  // Fraction of the perimeter that should be a gap (no stroke) for a given level.
  // Level 2 (diamond): half the perimeter is gap → stroke covers only 2 of 4 sides.
  // Other levels: 0 gap → full stroke.
  function levelStrokeGapFraction(level) {
    return level === 2 ? 0.5 : 0;
  }

  // Apply the static, final stroke styling for a given level.
  function applyShapeStrokeStyle(pathEl, level) {
    const gapFrac = levelStrokeGapFraction(level);
    if (gapFrac > 0) {
      const L = pathEl.getTotalLength();
      const gap = L * gapFrac;
      const dash = L - gap;
      // Path starts at the first corner. The gap covers the first half of the perimeter
      // (top→right→bottom sides), the dash covers the second half (bottom→left→top).
      pathEl.setAttribute('stroke-dasharray', '0 ' + gap.toFixed(3) + ' ' + dash.toFixed(3));
    } else {
      pathEl.removeAttribute('stroke-dasharray');
    }
  }

  // ===== STATE =====
  let added = new Set(); // attraction ids currently added — free selection, any order

  // ===== DERIVED =====
  function levelForDisplay() {
    return Math.max(1, Math.min(5, added.size + 1));
  }

  // Added attractions in insertion order (the order the user picked them).
  function addedInOrder() {
    return Array.from(added).map(id => ATTRACTIONS.find(a => a.id === id));
  }

  // Added attractions in canonical (ATTRACTIONS array) order.
  function addedCanonical() {
    return ATTRACTIONS.filter(a => added.has(a.id));
  }

  function priceForAttraction(attractionId) {
    const attr = ATTRACTIONS.find(a => a.id === attractionId);
    const lvl = levelForDisplay();
    return attr.prices[lvl];
  }

  function totalPrice() {
    let total = LONDON_EYE_PRICE;
    const lvl = levelForDisplay();
    added.forEach(id => {
      const attr = ATTRACTIONS.find(a => a.id === id);
      total += attr.prices[lvl];
    });
    return total;
  }

  function bundleContentsText() {
    if (added.size === 0) return 'London Eye - Standard ticket';
    const names = addedCanonical().map(a => a.name);
    return 'London Eye + ' + names.join(' + ');
  }

  // ===== RENDER =====
  function renderCards() {
    const scroll = document.getElementById('cards-scroll');
    scroll.innerHTML = '';

    const atLimit = added.size >= MAX_SECONDARIES;
    ATTRACTIONS.forEach(attr => {
      const isAdded = added.has(attr.id);
      const isLimited = !isAdded && atLimit;

      const lvl = levelForDisplay();
      const price = attr.prices[lvl];
      const save = attr.anchor - price;

      let stripHTML;
      if (isAdded) {
        stripHTML = `
          <div class="added-strip">
            <span class="added-label">Added!</span>
            <button class="remove-btn" data-action="remove" data-id="${attr.id}">REMOVE</button>
          </div>`;
      } else if (isLimited) {
        stripHTML = `
          <div class="limit-strip">
            <span class="limit-label">Bundle limit reached</span>
          </div>`;
      } else {
        stripHTML = `
          <div class="card-strip">
            <div class="price-info">
              <div class="ticket-icon">
                ${TICKET_SVG}
                <span>x 5</span>
              </div>
              <span class="anchor-price">£${attr.anchor}.00</span>
              <span class="current-price" data-price-id="${attr.id}">£${price}.00</span>
              <span class="save-label">Save £${save}</span>
            </div>
            <button class="add-btn" data-action="add" data-id="${attr.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>`;
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = attr.id;
      card.innerHTML = `
        <div class="card-visual">
          <img src="${attr.image}" alt="" />
          <div class="gradient">
            <h3>${attr.name}</h3>
            <p>${attr.description}</p>
          </div>
        </div>
        <div class="card-strip-area">${stripHTML}</div>
      `;
      scroll.appendChild(card);
    });
  }

  function renderFooter() {
    const lvl = levelForDisplay();

    // Level number label ("1st", "2nd", ...)
    document.getElementById('level-num').textContent = NUM_LABELS[lvl];

    // Shape morph: first render just sets the path; subsequent level changes morph.
    const pathEl = document.getElementById('level-shape-path');
    if (currentChipLevel === null) {
      pathEl.setAttribute('d', SHAPE_PATHS[lvl]);
      applyShapeStrokeStyle(pathEl, lvl);
    } else if (lvl !== currentChipLevel) {
      morphChipShape(pathEl, SHAPE_PATHS[currentChipLevel], SHAPE_PATHS[lvl], currentChipLevel, lvl);
    }
    currentChipLevel = lvl;

    const sublineKey = added.size; // 0..4
    document.getElementById('footer-subline').textContent = SUBLINES[sublineKey];

    document.getElementById('footer-contents').textContent = bundleContentsText();
    document.getElementById('total-amount').textContent = `£${totalPrice()}.00`;

    const thumb = document.getElementById('footer-thumb');
    thumb.innerHTML = renderThumbCollage();
  }

  // Builds the collage HTML for the footer thumbnail.
  // The London Eye is ALWAYS the first image in the collage. Secondary attractions fill the
  // remaining slots in the order the user added them.
  //   0 secondaries → just the London Eye  (1 image, full)
  //   1 secondary   → Eye top, secondary bottom  (horizontal split)
  //   2 secondaries → Eye top (full width), 2 secondaries on bottom row
  //   3 secondaries → 2x2 grid: Eye TL + 3 secondaries
  //   4 secondaries → 2x2 grid: Eye TL + 3 secondaries; the 4th (last-added) overlays as a center circle
  function renderThumbCollage() {
    const secondaries = addedInOrder();
    const cells = [
      `<img src="${THUMBS[0]}" alt="London Eye" data-id="eye" />`,
      ...secondaries.map(a => `<img src="${a.image}" alt="${a.name}" data-id="${a.id}" />`)
    ];
    const n = cells.length;
    return `<div class="thumb-collage thumb-collage-${n}">${cells.join('')}</div>`;
  }

  function morphChipShape(pathEl, fromD, toD, fromLvl, toLvl, onComplete) {
    if (chipMorphCancel) chipMorphCancel();

    const fromGap = levelStrokeGapFraction(fromLvl);
    const toGap   = levelStrokeGapFraction(toLvl);
    const needsDashInterp = fromGap > 0 || toGap > 0;

    // Graceful fallback if flubber didn't load.
    if (typeof flubber === 'undefined' || !flubber.interpolate) {
      pathEl.setAttribute('d', toD);
      applyShapeStrokeStyle(pathEl, toLvl);
      if (onComplete) onComplete();
      return;
    }

    const interp = flubber.interpolate(fromD, toD, { maxSegmentLength: 2 });
    const start = performance.now();
    const duration = 550;
    let raf;
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      // easeInOutQuad
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      pathEl.setAttribute('d', interp(eased));

      // Interpolate stroke dasharray each frame so the partial stroke grows / shrinks
      // smoothly across the morph instead of flickering on at the end.
      if (needsDashInterp) {
        const gapFrac = fromGap + (toGap - fromGap) * eased;
        const totalL = pathEl.getTotalLength();
        const gap = totalL * gapFrac;
        const dash = totalL - gap;
        pathEl.setAttribute('stroke-dasharray', '0 ' + gap.toFixed(3) + ' ' + dash.toFixed(3));
      } else {
        pathEl.removeAttribute('stroke-dasharray');
      }

      if (t < 1) {
        raf = requestAnimationFrame(step);
      } else {
        chipMorphCancel = null;
        // Snap to the exact final stroke styling using the final path length.
        applyShapeStrokeStyle(pathEl, toLvl);
        if (onComplete) onComplete();
      }
    }
    raf = requestAnimationFrame(step);
    chipMorphCancel = () => { cancelAnimationFrame(raf); chipMorphCancel = null; };
  }

  // ===== Price rolling animation =====
  // Capture current prices BEFORE re-render, then after re-render, animate
  // a "slot machine" roll between old and new on each element whose value changed.
  const _animatingPrices = new Set();
  function finishAllPriceRolls() {
    Array.from(_animatingPrices).forEach(el => {
      if (typeof el._finishRoll === 'function') el._finishRoll();
    });
  }
  // Detect which of the three strip states a card is currently in.
  function cardStripState(card) {
    if (card.querySelector('.added-strip')) return 'added';
    if (card.querySelector('.limit-strip')) return 'limit';
    return 'unselected';
  }

  function captureRenderSnapshot() {
    finishAllPriceRolls(); // collapse any in-flight rolls so values are resolved
    const cards = {};
    document.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      const priceEl = card.querySelector('.current-price');
      const stripEl = card.querySelector('.card-strip-area');
      cards[id] = {
        price: priceEl ? priceEl.textContent : null,
        stripHTML: stripEl ? stripEl.innerHTML : null,
        stripState: cardStripState(card),
      };
    });
    const totalEl = document.getElementById('total-amount');
    const thumbEl = document.getElementById('footer-thumb');
    const contentsEl = document.getElementById('footer-contents');
    return {
      cards,
      total: totalEl ? totalEl.textContent : null,
      thumb: thumbEl ? thumbEl.innerHTML : null,
      contents: contentsEl ? contentsEl.textContent : null,
      level: currentChipLevel,
    };
  }

  function applyRenderRolls(snapshot) {
    if (!snapshot) return;
    // Overall direction comes from the level change.
    const levelUp = currentChipLevel > snapshot.level;

    // Per-card rolls
    document.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      const prev = snapshot.cards[id];
      if (!prev) return;

      const stripArea = card.querySelector('.card-strip-area');
      const newState = cardStripState(card);

      // If the strip transitioned between any of (unselected / added / limit), roll the strip.
      if (prev.stripState !== newState && stripArea && prev.stripHTML) {
        rollElement(stripArea, prev.stripHTML, stripArea.innerHTML, levelUp, 'html');
        return;
      }
      // Otherwise, if only the price changed, roll just the price.
      const priceEl = card.querySelector('.current-price');
      if (priceEl && prev.price && prev.price !== priceEl.textContent) {
        animatePriceChange(priceEl, prev.price);
      }
    });

    // Footer total (price → use numeric direction)
    const totalEl = document.getElementById('total-amount');
    if (totalEl && snapshot.total && snapshot.total !== totalEl.textContent) {
      animatePriceChange(totalEl, snapshot.total);
    }

    // Footer thumb image (HTML)
    const thumbEl = document.getElementById('footer-thumb');
    if (thumbEl && snapshot.thumb && snapshot.thumb !== thumbEl.innerHTML) {
      rollElement(thumbEl, snapshot.thumb, thumbEl.innerHTML, levelUp, 'html');
    }

    // Footer contents (title text)
    const contentsEl = document.getElementById('footer-contents');
    if (contentsEl && snapshot.contents && snapshot.contents !== contentsEl.textContent) {
      rollElement(contentsEl, snapshot.contents, contentsEl.textContent, levelUp, 'text');
    }
  }

  function parsePriceText(t) {
    if (!t) return null;
    const m = String(t).match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  }

  // Generic roulette/slot-machine roll. Works for both text and HTML content.
  // Direction: levelUp=true (e.g. user added an attraction) → new content enters from below,
  //            levelUp=false (user removed) → new content enters from above.
  //
  // mode='text': old/newContent are plain text; el.style.color is set to transparent to hide
  //              the existing text while the overlay does the rolling.
  // mode='html': old/newContent are HTML strings; direct children of el get opacity:0 while
  //              the overlay rolls. The element keeps its layout box intact.
  function rollElement(el, oldContent, newContent, levelUp, mode) {
    if (oldContent === newContent) return;
    mode = mode || 'text';

    const elH = el.getBoundingClientRect().height;
    if (!elH) return; // not rendered yet — bail

    const originalColor = getComputedStyle(el).color;
    const saved = {
      position: el.style.position,
      color: el.style.color,
      childOpacities: [],
    };
    el.style.position = 'relative';

    if (mode === 'text') {
      el.style.color = 'transparent';
    } else {
      Array.from(el.children).forEach(child => {
        saved.childOpacities.push({ el: child, val: child.style.opacity });
        child.style.opacity = '0';
      });
    }

    // levelUp=true  → cells = [old, new], stack slides translateY(0) → -elH
    // levelUp=false → cells = [new, old], stack slides translateY(-elH) → 0
    const cellTopHTML    = levelUp ? oldContent : newContent;
    const cellBottomHTML = levelUp ? newContent : oldContent;
    const fromY = levelUp ? 0 : -elH;
    const toY   = levelUp ? -elH : 0;

    const overlay = document.createElement('div');
    overlay.className = '__roll-overlay';
    overlay.style.cssText =
      'position:absolute;top:0;left:0;right:0;bottom:0;' +
      'overflow:hidden;pointer-events:none;' +
      'color:' + originalColor + ';';

    // Cell box just has a fixed height — its contents inherit the element's natural
    // line-height, font, and wrapping behavior. This way single-line text (prices) renders
    // exactly as before, AND multi-line text (the bundle title) wraps the same way the
    // element did before the animation, with no forced nowrap.
    const cellStyle = 'display:block;height:' + elH + 'px;';
    overlay.innerHTML =
      '<div class="__roll-stack" style="display:block; transform: translateY(' + fromY + 'px); will-change: transform;">' +
        '<div style="' + cellStyle + '">' + cellTopHTML + '</div>' +
        '<div style="' + cellStyle + '">' + cellBottomHTML + '</div>' +
      '</div>';
    el.appendChild(overlay);

    const stack = overlay.querySelector('.__roll-stack');
    void stack.offsetHeight; // force layout so transition has a "from" frame
    stack.style.transition = 'transform 450ms cubic-bezier(0.5, 0, 0.5, 1)';
    stack.style.transform = 'translateY(' + toY + 'px)';

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      stack.removeEventListener('transitionend', finish);
      if (overlay.parentNode) overlay.remove();
      el.style.position = saved.position;
      el.style.color = saved.color;
      saved.childOpacities.forEach(({ el: c, val }) => { c.style.opacity = val; });
      _animatingPrices.delete(el);
      el._finishRoll = null;
    };
    el._finishRoll = finish;
    _animatingPrices.add(el);
    stack.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 800);
  }

  function animatePriceChange(el, oldText) {
    const newText = el.textContent;
    const oldP = parsePriceText(oldText);
    const newP = parsePriceText(newText);
    if (oldP === null || newP === null || oldP === newP) return;
    // Price went DOWN → user added an attraction → level went UP → new from below.
    const levelUp = newP < oldP;
    rollElement(el, oldText, newText, levelUp, 'text');
  }

  function bounceChip() {
    const chip = document.getElementById('level-chip');
    chip.classList.remove('bouncing');
    void chip.offsetWidth;
    chip.classList.add('bouncing');
  }

  function fullRender(animate = false) {
    const snapshot = animate ? captureRenderSnapshot() : null;
    renderCards();
    renderFooter();
    if (animate) {
      requestAnimationFrame(() => {
        applyRenderRolls(snapshot);
        bounceChip();
      });
    }
  }

  // ===== EVENTS =====
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    if (target.disabled || target.classList.contains('disabled')) return;
    const id = target.dataset.id;
    const action = target.dataset.action;
    if (action === 'add') {
      if (added.has(id)) return;
      if (added.size >= MAX_SECONDARIES) return;
      added.add(id);
      fullRender(true);
    } else if (action === 'remove') {
      added.delete(id);
      fullRender(true);
    }
  });

  // ===== INIT =====
  fullRender(false);
</script>
</body>
</html>
